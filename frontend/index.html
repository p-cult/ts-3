    /**
     * Extract valid stage tokens; strip/ignore malformed pieces
     * (lone "#", "# tak", spaces inside a token, empty, non-# junk).
     */
    /**
     * Stage token parse — mirrors middleware/domain/stages.js (never throws).
     * @returns {{ ok: true, tokens: string[] } | { ok: false, error: string }}
     */
    function parseStageTokensClient(input) {
      try {
        let parts = [];
        if (Array.isArray(input)) {
          parts = input.map((s) => String(s || '').trim()).filter(Boolean);
        } else {
          const trimmed = String(input == null ? '' : input).trim();
          if (!trimmed) return { ok: true, tokens: [] };
          if (/#\s/.test(trimmed)) {
            return {
              ok: false,
              error: 'invalid stage token — no spaces after #; use #take or #fill-and-sign (not "# tak")',
            };
          }
          if (/(^|\s)#$/.test(trimmed)) {
            return {
              ok: false,
              error: 'invalid stage token "#" — trailing or lone # is incomplete (at end of input); use #take or #fill-and-sign',
            };
          }
          parts = trimmed.split(/\s+/).filter(Boolean);
        }
        const TOKEN_RE = /^#[A-Za-z0-9][A-Za-z0-9._\-]*$/;
        const tokens = [];
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (/\s/.test(p)) {
            return {
              ok: false,
              error: 'invalid stage token "' + p + '" — no spaces inside a token; use #fill-and-sign',
            };
          }
          if (p === '#') {
            return {
              ok: false,
              error: 'invalid stage token "#" — trailing or lone # is incomplete; use #take or #fill-and-sign',
            };
          }
          if (!p.startsWith('#')) {
            return {
              ok: false,
              error: 'invalid stage token "' + p + '" — each stage must start with # (e.g. #design)',
            };
          }
          if (!TOKEN_RE.test(p)) {
            return {
              ok: false,
              error: 'invalid stage token "' + p + '" — use #Name with letters/numbers/._- only (no spaces after #)',
            };
          }
          tokens.push(p);
        }
        return { ok: true, tokens };
      } catch (err) {
        return {
          ok: false,
          error: 'invalid stage tokens — could not parse',
        };
      }
    }

    function isRestrictedKindVal(k) {
      return k === 'pseudo' || k === 'routine' || k === 'not_a_task';
    }

    // —— Inline edit on committed cards (no dialog) ——
    function eq(card, sel) { return card.querySelector('.edit-body ' + sel); }

    function getEditMs(card) {
      return (eq(card, '[data-f="ms"]') && eq(card, '[data-f="ms"]').value) || 'main';
    }
    function setEditMs(card, v) {
      const ms = v === 'sub' ? 'sub' : 'main';
      const hid = eq(card, '[data-f="ms"]');
      if (hid) hid.value = ms;
      card.querySelectorAll('.edit-body .edit-ms .seg-btn').forEach((b) => {
        b.classList.toggle('on', b.dataset.ms === ms);
      });
    }
    function getEditKindRadio(card) {
      const el = card.querySelector('.edit-body input[data-f="kind"]:checked');
      return (el && el.value) || 'normal';
    }
    function setEditKindRadio(card, v) {
      const val = (v === 'pseudo' || v === 'routine') ? v : 'normal';
      card.querySelectorAll('.edit-body input[data-f="kind"]').forEach((r) => {
        r.checked = r.value === val;
      });
    }
    function resolvedEditKind(card) {
      const kr = getEditKindRadio(card);
      if (kr === 'pseudo') return 'pseudo';
      if (kr === 'routine') return 'routine';
      return getEditMs(card) === 'sub' ? 'sub' : 'main';
    }
    function setEditKindControlsEnabled(card, on) {
      card.querySelectorAll('.edit-body .edit-ms .seg-btn').forEach((b) => { b.disabled = !on; });
      card.querySelectorAll('.edit-body input[data-f="kind"]').forEach((r) => { r.disabled = !on; });
    }
    function editStagesAllowed(card) {
      const msFld = eq(card, '[data-efld="ms"]');
      if (isAdminKindUi() && msFld && !msFld.hidden) return getEditKindRadio(card) === 'normal';
      return true;
    }
    function setEditFld(card, name, visible) {
      const el = eq(card, '[data-efld="' + name + '"]');
      if (el) el.hidden = !visible;
    }

    /**
     * Kind-aware edit form: pseudo/routine/not_a_task → status (+ admin kind) only.
     * Called on open and when admin flips kind radios.
     */
    function applyEditModeFromKind(card, t) {
      const kindVal = resolvedEditKind(card);
      const scope = perms().editScope || 'none';
      const statusOnlyRole = scope === 'status';
      const useRestricted = isRestrictedKindVal(kindVal);
      const full = scope === 'all' || scope === 'own';
      const showAdminKind = isAdminKindUi();
      const banner = eq(card, '[data-f="banner"]');
      const nameEl = eq(card, '[data-f="name"]');
      const nameRo = eq(card, '[data-f="nameRo"]');
      const stSel = eq(card, '[data-f="status"]');
      const curStatus = String((t && t.status) || '');
      const p2DoneLocked = role() === 'P2' && curStatus === 'Done';
      function en(node, on) { if (node) node.disabled = !on; }

      if (useRestricted) {
        if (banner) {
          banner.hidden = false;
          banner.textContent = 'This kind only allows status changes.';
        }
        ['project','desc','notes','links','priority','parent','stages','start','end'].forEach((f) => setEditFld(card, f, false));
        setEditFld(card, 'ms', showAdminKind);
        setEditFld(card, 'kind', showAdminKind);
        setEditFld(card, 'name', true);
        if (nameEl) nameEl.hidden = true;
        if (nameRo) nameRo.hidden = false;
        setEditFld(card, 'status', true);
        en(stSel, !p2DoneLocked);
        setEditKindControlsEnabled(card, showAdminKind);
        if (p2DoneLocked && banner) {
          banner.textContent = isTaskCompletionApproved(t)
            ? 'Done — task Approved by admin (status locked).'
            : 'Done — Waiting for approval (status locked).';
        }
        return;
      }

      if (banner && !p2DoneLocked) banner.hidden = true;
      setEditFld(card, 'project', false);
      setEditFld(card, 'name', !statusOnlyRole);
      setEditFld(card, 'desc', !statusOnlyRole);
      setEditFld(card, 'notes', !statusOnlyRole);
      setEditFld(card, 'links', !statusOnlyRole);
      setEditFld(card, 'start', true);
      setEditFld(card, 'end', true);
      setEditFld(card, 'status', true);
      setEditFld(card, 'priority', scope === 'all');
      setEditFld(card, 'ms', showAdminKind && !statusOnlyRole);
      setEditFld(card, 'kind', showAdminKind && !statusOnlyRole);
      setEditFld(card, 'parent', !statusOnlyRole);
      setEditFld(card, 'stages', !statusOnlyRole);
      if (nameEl) nameEl.hidden = false;
      if (nameRo) nameRo.hidden = true;
      en(nameEl, full && !statusOnlyRole);
      en(eq(card, '[data-f="desc"]'), full && !statusOnlyRole);
      setNotesEnabled(card.querySelector('.edit-body') || card, full && !statusOnlyRole);
      en(stSel, (full || statusOnlyRole) && !p2DoneLocked);
      en(eq(card, '[data-f="priority"]'), scope === 'all');
      const endEditable = full && !statusOnlyRole && curStatus !== 'Done';
      const endEl = eq(card, '[data-f="end"]');
      const endRo = eq(card, '[data-f="endRo"]');
      if (endEl) endEl.hidden = !endEditable;
      if (endRo) endRo.hidden = endEditable;
      en(endEl, endEditable);
      setEditKindControlsEnabled(card, showAdminKind && !statusOnlyRole && (full || !!perms().canSetKind));
      en(eq(card, '[data-f="parent"]'), full && !statusOnlyRole);
      en(eq(card, '[data-f="stages"]'), full && !statusOnlyRole);
      const stageInteractive = full && !statusOnlyRole;
      syncEditStagesUi(card, { interactive: stageInteractive, rewrite: false, showError: false });
    }

    function applyKindToEditCard(card, t) {
      let kindVal = 'main';
      if (t) {
        kindVal = t.kind || (t.kindIcon === 'P' ? 'pseudo' : t.kindIcon === 'R' ? 'routine' : t.kindIcon === 'N' ? 'not_a_task' : (t.kind || 'main'));
        if (t.kindIcon && !t.kind) {
          kindVal = t.kindIcon === 'P' ? 'pseudo' : t.kindIcon === 'R' ? 'routine' : t.kindIcon === 'N' ? 'not_a_task' : 'main';
        }
      }
      if (kindVal === 'sub') {
        setEditMs(card, 'sub');
        setEditKindRadio(card, 'normal');
      } else if (kindVal === 'pseudo') {
        setEditMs(card, 'main');
        setEditKindRadio(card, 'pseudo');
      } else if (kindVal === 'routine') {
        setEditMs(card, 'main');
        setEditKindRadio(card, 'routine');
      } else {
        setEditMs(card, 'main');
        setEditKindRadio(card, 'normal');
      }
      return kindVal;
    }

    function fillEditParentOptions(card, selectedId, excludeId) {
      const sel = eq(card, '[data-f="parent"]');
      const hint = eq(card, '[data-f="parentHint"]');
      if (!sel) return;
      sel.innerHTML = '';
      const opt0 = document.createElement('option');
      opt0.value = ''; opt0.textContent = '— Select a Main —';
      sel.appendChild(opt0);
      const mains = (state.allForParent || []).filter((t) => {
        if (t.ref === excludeId) return false;
        if (t.kindIcon) return false;
        if (t.kind === 'sub') return false;
        if (t.kind && t.kind !== 'main') return false;
        return true;
      });
      if (hint) hint.hidden = mains.length > 0;
      sel.disabled = mains.length === 0;
      mains.forEach((t) => {
        const o = document.createElement('option');
        o.value = t.ref;
        o.textContent = t.name + ' (' + shortRef(t.ref) + ')';
        sel.appendChild(o);
      });
      if (selectedId && mains.some((m) => m.ref === selectedId)) sel.value = selectedId;
      else sel.value = '';
    }

    function syncEditParentVisibility(card, preferredParent) {
      if (isRestrictedKindVal(resolvedEditKind(card))) {
        const parentFld = eq(card, '[data-efld="parent"]');
        if (parentFld) parentFld.hidden = true;
        return;
      }
      const admin = isAdminKindUi();
      const msFld = eq(card, '[data-efld="ms"]');
      const parentFld = eq(card, '[data-efld="parent"]');
      if (!parentFld) return;
      const excludeId = card.dataset.ref || '';
      const parentSel = eq(card, '[data-f="parent"]');
      const keep = preferredParent != null
        ? preferredParent
        : (parentSel ? parentSel.value : '');
      if (admin && msFld && !msFld.hidden) {
        const show = getEditMs(card) === 'sub';
        parentFld.hidden = !show;
        const lab = parentFld.querySelector('label');
        if (lab) lab.textContent = 'Parent Main task';
        if (!show && parentSel) parentSel.value = '';
        fillEditParentOptions(card, show ? keep : '', excludeId);
      } else {
        parentFld.hidden = false;
        const lab = parentFld.querySelector('label');
        if (lab) lab.textContent = 'Parent Main (optional — selecting one makes this a sub)';
        fillEditParentOptions(card, keep, excludeId);
      }
    }

    function syncEditStagesVisibility(card) {

    function renderEditStageChips(card, tokens, currentIndex, interactive) {
      const box = eq(card, '[data-f="stageChips"]');
      const hint = eq(card, '[data-f="stagePickHint"]');
      const bar = eq(card, '[data-f="stageBar"]');
      const fillEl = eq(card, '[data-f="stageBarFill"]');
      const idxEl = eq(card, '[data-f="stageIdx"]');
      const errEl = eq(card, '[data-f="err"]');
      if (!box) return;
      box.innerHTML = '';
      const toks = tokens || [];
      const idx = Math.max(0, Math.min(Number(currentIndex) || 0, toks.length));
      if (hint) hint.hidden = !toks.length;
      if (bar) bar.hidden = !toks.length;
      if (fillEl) fillEl.style.width = (toks.length ? Math.round((idx / toks.length) * 100) : 0) + '%';
      if (!toks.length) {
        box.innerHTML = '<span class="hint-sm">No stages yet — type #tokens above (e.g. #design #build).</span>';
        return;
      }
      const id = card.dataset.ref || '';
      toks.forEach((tok, i) => {
        const pos = i + 1;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'stage-chip' + (pos <= idx ? ' on' : '');
        b.textContent = tok;
        b.disabled = !interactive;
        b.title = interactive ? 'Mark progress through ' + tok : tok;
        if (interactive) {
          b.onclick = async () => {
            idxEl.value = String(pos);
            renderEditStageChips(card, toks, pos, true);
            if (!id) return;
            if (errEl) errEl.textContent = '';
            try {
              await api('PATCH', '/api/tasks/' + encodeURIComponent(id) + '/stages', {
                text: toks.join(' '),
                currentIndex: pos,
              });
              // stay open — board refresh would collapse the inline panel
            } catch (err) {
              if (errEl) errEl.textContent = err.message;
            }
          };
        }
        box.appendChild(b);
      });
      if (interactive) {
        const z = document.createElement('button');
        z.type = 'button'; z.className = 'stage-chip'; z.textContent = 'Clear';
        z.title = 'Reset progress to start';
        z.onclick = async () => {
          idxEl.value = '0';
          renderEditStageChips(card, toks, 0, true);
          if (!id) return;
          if (errEl) errEl.textContent = '';
          try {
            await api('PATCH', '/api/tasks/' + encodeURIComponent(id) + '/stages', {
              text: toks.join(' '), currentIndex: 0,
            });
          } catch (err) { if (errEl) errEl.textContent = err.message; }
        };
        box.appendChild(z);
      }
    }

    function syncEditStagesUi(card, opts) {
      opts = opts || {};
      const stagesEl = eq(card, '[data-f="stages"]');
      const idxEl = eq(card, '[data-f="stageIdx"]');
      const errEl = eq(card, '[data-f="err"]');
      if (!stagesEl) return [];
      const interactive = opts.interactive != null
        ? !!opts.interactive
        : !stagesEl.disabled;
      const parsed = parseStageTokensClient(stagesEl.value);
      if (!parsed.ok) {
        if (errEl && opts.showError !== false) errEl.textContent = parsed.error;
        renderEditStageChips(card, [], Number(idxEl && idxEl.value) || 0, interactive);
        return [];
      }
      if (errEl && opts.clearError) errEl.textContent = '';
      if (opts.rewrite) stagesEl.value = parsed.tokens.join(' ');
      let idx = Number(idxEl && idxEl.value) || 0;
      if (idx < 0) idx = 0;
      if (idx > parsed.tokens.length) idx = parsed.tokens.length;
      if (idxEl) idxEl.value = String(idx);
      renderEditStageChips(card, parsed.tokens, idx, interactive);
      return parsed.tokens;
    }

    function formatHistWhen(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      } catch (e) {
        return String(iso);
      }
    }

    function historyEntryRatings(entry, t) {
      const raw = entry && Array.isArray(entry.ratings) ? entry.ratings : [];
      return raw.map(normalizeApiRating).filter(Boolean).map((r) => ({
        url: r.url,
        name: linkNameForUrl(t, r.url, entry && entry.linkAtReview) || linkDisplayName({ url: r.url }),
        stars: r.stars,
        revTag: r.tag,

    function renderHistoryHtml(hist, t) {
      const list = Array.isArray(hist) ? hist.slice() : [];
      if (!list.length) {
        return '<p class="hist-empty">No review history yet.</p>';
      }
      return '<div class="hist-list" role="list">'
        + list.map((entry) => {
          const action = String((entry && entry.action) || 'entry').toLowerCase();
          const ratings = historyEntryRatings(entry, t);
          const overall = historyOverallNotes(entry);
          const ratingsHtml = ratings.length
            ? '<ul class="hist-ratings">'
              + ratings.map((r) => {
                const label = r.url
                  ? '<a class="task-link-open" href="' + String(r.url).replace(/"/g, '')
                    + '" target="_blank" rel="noopener" title="' + escapeHtml(r.url) + '">'
                    + escapeHtml(r.name || linkDisplayName({ url: r.url })) + '</a>'
                  : '<span>' + escapeHtml(r.name || 'link') + '</span>';
                const stars = '★'.repeat(Math.max(0, Math.min(3, r.stars)));
                const tag = r.revTag
                  ? '<span class="link-outcome-tag">' + escapeHtml(r.revTag) + '</span>'
                  : '';
                const comment = r.revComment
                  ? '<span class="link-outcome-comment">' + escapeHtml(r.revComment) + '</span>'
                  : '';
                const ver = linkFileVersionLabel(r.iter);
                return '<li>'
                  + '<span class="task-link-iter">' + escapeHtml(ver) + '</span> '
                  + label
                  + ' <span class="hist-stars" title="' + r.stars + ' stars">' + stars + '</span>'
                  + tag + comment + '</li>';
              }).join('')
              + '</ul>'
            : '';
          const notesHtml = overall
            ? '<div class="hist-notes">' + escapeHtml(overall) + '</div>'
            : '';
          return ''
            + '<article class="hist-entry" role="listitem">'
            + '<div class="hist-entry-head">'
            + '<span class="hist-action is-' + escapeHtml(action) + '">' + escapeHtml(action) + '</span>'
            + '<span class="hist-meta">' + escapeHtml(entry.byUsername || '—') + '</span>'
            + '<span class="hist-meta">' + escapeHtml(formatHistWhen(entry.at)) + '</span>'
            + '</div>'
            + ratingsHtml
            + notesHtml
            + '</article>';
        }).join('')

    async function toggleTaskHistory(card, t) {
      if (!card || !t || !t.ref) return;
      const body = card.querySelector('.history-body');
      const btn = card.querySelector('.task-compact [data-act="history"]');
      if (!body) return;
      const opening = body.hidden;
      body.hidden = !opening;
      if (btn) btn.textContent = opening ? 'Hide history' : 'History';
      if (!opening) return;
      if (body.dataset.loaded === '1') return;
      body.innerHTML = '<p class="hist-empty">Loading history…</p>';
      try {
        const r = await api('GET', '/api/tasks/' + encodeURIComponent(t.ref));
        const detail = r && r.task;
        const hist = (detail && detail.review && detail.review.history) || [];
        // Keep API review summary on the in-memory task so card outcomes use lastRatings/history.
        const idx = (state.tasks || []).findIndex((x) => x.ref === t.ref);
        if (idx >= 0 && detail && detail.review) {
          state.tasks[idx].review = Object.assign({}, state.tasks[idx].review, detail.review);
          if (detail.reviewIteration != null) {
            state.tasks[idx].reviewIteration = detail.reviewIteration;
          }
          const compact = card.querySelector('.task-links-compact');
          if (compact) {
            const wrap = document.createElement('div');
            wrap.innerHTML = taskLinksCompactHtml(state.tasks[idx]);
            const next = wrap.firstChild;
            if (next) compact.replaceWith(next);
            else compact.remove();
          } else {
            const host = card.querySelector('.task-compact');
            if (host) {
              const actions = host.querySelector('.actions');
              const html = taskLinksCompactHtml(state.tasks[idx]);
              if (html && actions) actions.insertAdjacentHTML('beforebegin', html);
            }
          }
        }
        body.innerHTML = renderHistoryHtml(hist, state.tasks[idx] || t);
        body.dataset.loaded = '1';
      } catch (err) {
        body.innerHTML = '<p class="err">' + escapeHtml(err.message || 'Failed to load history') + '</p>';

    function syncReviewActionButtons(card) {
      const submit = rq(card, '[data-act="revSubmit"]');
      if (!submit) return;
      const rows = card.querySelectorAll('.review-body .rev-link-row[data-rateable="1"]');
      let ok = rows.length > 0;

      });

    function validateRevLinkRow(row, showMsg) {
      if (!row || row.dataset.rateable !== '1') return true;
      const stars = Number(row.dataset.stars) || 0;
      const tagEl = row.querySelector('[data-f="revTag"]');
      const commentEl = row.querySelector('[data-f="revComment"]');
      const tag = tagEl ? tagEl.value.trim() : '';
      const comment = commentEl ? commentEl.value.trim() : '';
      let err = '';
      if (stars < 1 || stars > 3) err = 'Pick 1–3 stars.';
      else if (stars === 2 && !tag) err = '2★ requires a preset tag.';
      else if (stars === 1 && (!tag || !comment)) err = '1★ requires a tag and comment.';
      if (showMsg) {
        const hint = row.querySelector('[data-f="revRule"]');
        if (hint && err) hint.textContent = err;
      }
      return !err;
    }

    function revRuleHint(stars) {
      if (stars === 3) return '3★ Approved — comment optional.';
      if (stars === 2) return '2★ Pick a tag — Ready for task Done later without another approval.';
      if (stars === 1) return '1★ Tag + comment required — not done, another round.';
      return 'Rate 1–3 stars.';
    }

    function syncRevLinkRow(row) {
      if (!row || row.dataset.rateable !== '1') return;
      const stars = Number(row.dataset.stars) || 0;
      row.querySelectorAll('.star-btn').forEach((btn) => {
        const n = Number(btn.dataset.star) || 0;
        btn.classList.toggle('on', n > 0 && n <= stars);
        btn.setAttribute('aria-pressed', n === stars ? 'true' : 'false');
      });
      const tagEl = row.querySelector('[data-f="revTag"]');
      const commentEl = row.querySelector('[data-f="revComment"]');
      const hint = row.querySelector('[data-f="revRule"]');
      if (tagEl) {
        const needTag = stars === 1 || stars === 2;
        tagEl.disabled = !needTag;
        if (!needTag) tagEl.value = '';
      }
      if (commentEl) {
        const needComment = stars === 1 || stars === 3;
        commentEl.disabled = !needComment;
        if (!needComment) commentEl.value = '';
        commentEl.placeholder = stars === 3 ? 'Comment (optional)…' : 'Comment (required)…';
      }
      if (hint) hint.textContent = revRuleHint(stars);
    }

    function setRevLinkStars(row, stars) {
      if (!row || row.dataset.rateable !== '1') return;
      row.dataset.stars = String(Math.max(0, Math.min(3, Number(stars) || 0)));
      syncRevLinkRow(row);
    }

    /** Ratings from rateable admin rows only (not locked 3★ lines). */
    function collectRevLinkRatings(card) {
      const rows = card.querySelectorAll('.review-body .rev-link-row[data-rateable="1"]');
      const out = [];
      rows.forEach((row) => {
        const url = normalizeUrlInput(row.dataset.url || '');
        if (!url) return;
        const stars = Number(row.dataset.stars) || 0;
        const tagEl = row.querySelector('[data-f="revTag"]');
        const commentEl = row.querySelector('[data-f="revComment"]');
        const tag = tagEl ? tagEl.value.trim() : '';
        const comment = commentEl ? commentEl.value.trim() : '';
        out.push({
          url,
          ownerTag: row.dataset.ownerTag || '',
          stars,
          revTag: (stars === 1 || stars === 2) ? tag : '',
          revComment: (stars === 1 || stars === 3) ? comment : '',
        });
      });
      return out;
    }

    /** Keep prior 3★ files in the API payload so lastRatings stays complete. */
    function frozenApprovedRatings(t) {
      return linksFromTask(t)
        .map((l) => {
          const r = latestRatingForUrl(t, l.url);
          if (!r || r.stars !== 3) return null;
          const o = { url: r.url, stars: 3 };
          if (r.tag) o.tag = r.tag;
          if (r.comment) o.comment = r.comment;
          return o;
        })
        .filter(Boolean);
    }

    async function openInlineReview(el, t) {
      if (!el || !t || !perms().canReviewModerate) return;
      closeAllInlineEdits();
      closeAllInlineReviews(el);
      closeInlineEdit(el);

      el.classList.add('reviewing');
      const body = el.querySelector('.review-body');
      body.hidden = false;
      body.innerHTML = '<p class="muted">Loading review…</p>';

      // Needs-review list often omits full history — fetch detail so 3★ locks are accurate.
      let task = t;
      try {
        const r = await api('GET', '/api/tasks/' + encodeURIComponent(t.ref));
        if (r && r.task) {
          task = r.task;
          const idx = (state.tasks || []).findIndex((x) => x.ref === t.ref);
          if (idx >= 0) {
            state.tasks[idx] = Object.assign({}, state.tasks[idx], {
              link: task.link != null ? task.link : state.tasks[idx].link,
              review: task.review || state.tasks[idx].review,
              reviewState: task.reviewState != null ? task.reviewState : state.tasks[idx].reviewState,
              reviewIteration: task.reviewIteration != null
                ? task.reviewIteration
                : state.tasks[idx].reviewIteration,
            });
            task = state.tasks[idx];
          }
        }
      } catch (e) {
        /* fall back to list payload */
      }

      const links = linksFromTask(task);
      const approved = [];
      const rateable = [];
      links.forEach((l) => {
        const r = latestRatingForUrl(task, l.url);
        const stars = r ? r.stars : 0;
        const entry = {
          url: l.url,
          name: l.name || '',
          tag: l.tag || '',
          iter: Math.max(1, Number(l.iter) || 1),
          stars,
          revTag: r ? r.tag : '',
          revComment: r ? r.comment : '',
          ratedAt: r ? (linkStarRatedAt(task, l.url, r.stars) || taskRatingsAt(task)) : '',
        };
        if (stars === 3) approved.push(entry);
        else rateable.push(entry);
      });

      // Open tabs only for files that still need a decision
      rateable.forEach((l) => {
        try { window.open(l.url, '_blank', 'noopener'); } catch (err) { /* popup blocked */ }
      });

      const approvedHtml = approved.length
        ? '<div class="rev-approved-block" data-f="revApproved">'
          + '<p class="hint-sm" style="margin:0 0 .25rem">Already approved (read-only)</p>'
          + approved.map((l) => (
            '<div class="task-links-compact-row is-3" data-approved="1">'
            + approvedLinkLineHtml(l)
            + '</div>'
          )).join('')
          + '</div>'
        : '';

      const rateableHtml = rateable.length
        ? rateable.map((l) => {
          const safeUrl = String(l.url).replace(/"/g, '');
          const ver = linkFileVersionLabel(l);
          return ''
            + '<div class="rev-link-row" data-rateable="1" data-url="' + safeUrl
            + '" data-owner-tag="' + escapeHtml(l.tag || '') + '" data-stars="0">'
            + '<div class="rev-link-head">'
            + linkOpenHtml(l)
            + '<span class="task-link-iter">' + escapeHtml(ver) + '</span>'
            + '</div>'
            + '<div class="star-row" role="group" aria-label="Star rating">'
            + [1, 2, 3].map((n) => (
              '<button type="button" class="star-btn" data-act="setStar" data-star="' + n
              + '" aria-label="' + n + ' star' + (n > 1 ? 's' : '') + '" aria-pressed="false">★</button>'
            )).join('')
            + '</div>'
            + '<select class="rev-tag" data-f="revTag" disabled>' + presetTagOptionsHtml() + '</select>'
            + '<textarea class="rev-comment" data-f="revComment" rows="2" disabled'
            + ' placeholder="Comment…"></textarea>'
            + '<p class="rev-rule" data-f="revRule">' + revRuleHint(0) + '</p>'
            + '</div>';
        }).join('')
        : '<p class="muted">No files need a rating right now.</p>';

      const pendingN = rateable.length;
      body.innerHTML =
        '<p class="muted" style="margin:0 0 .35rem" data-f="revHeader">'
        + (pendingN
          ? ('Rate ' + pendingN + ' pending file' + (pendingN === 1 ? '' : 's')
            + (approved.length ? ' · ' + approved.length + ' already approved' : '')
            + '.')
          : 'All files on this task are already approved.')
        + '</p>'
        + approvedHtml
        + '<div class="rev-links" data-f="revLinks">' + rateableHtml + '</div>'
        + '<div class="err" data-f="revErr"></div>'
        + '<div class="actions">'
        + '<button type="button" class="btn primary" data-act="revSubmit" disabled>Submit Feedback</button>'
        + '<button type="button" class="btn" data-act="revCancel">Cancel</button>'
        + '</div>';

      body.querySelectorAll('.rev-link-row[data-rateable="1"]').forEach((row) => syncRevLinkRow(row));
      syncReviewActionButtons(el);
    }

    async function submitInlineReview(card) {
      const errEl = rq(card, '[data-f="revErr"]');
      if (errEl) errEl.textContent = '';
      const id = card.dataset.ref;
      if (!id) {
        if (errEl) errEl.textContent = 'Missing task ref.';
        return;
      }

      const rateableRows = card.querySelectorAll('.review-body .rev-link-row[data-rateable="1"]');
      if (!rateableRows.length) {
        if (errEl) errEl.textContent = 'No pending files to rate.';
        syncReviewActionButtons(card);
        return;
      }

      let valid = true;
      rateableRows.forEach((row) => {
        if (!validateRevLinkRow(row, true)) valid = false;
      });
      if (!valid) {
        if (errEl) errEl.textContent = 'Finish rating every pending file (see hints).';
        syncReviewActionButtons(card);
        return;
      }

      const rated = collectRevLinkRatings(card);
      if (!rated.length) {
        if (errEl) errEl.textContent = 'No ratings collected.';
        syncReviewActionButtons(card);
        return;
      }

      const task = (state.tasks || []).find((x) => x.ref === id) || { ref: id, link: '' };
      const needsRework = rated.some((r) => r.stars === 1);
      const path = needsRework ? '/review/rework' : '/review/approve';
      const fromForm = rated.map((r) => {
        const o = { url: r.url, stars: r.stars };
        if (r.revTag) o.tag = r.revTag;
        if (r.revComment) o.comment = r.revComment;
        return o;
      });
      // Preserve locked 3★ files in the payload (not re-rated in the panel).
      const frozen = frozenApprovedRatings(task);
      const frozenUrls = new Set(fromForm.map((r) => r.url));
      const apiRatings = fromForm.concat(frozen.filter((r) => !frozenUrls.has(r.url)));

      const notes = needsRework ? 'Rework requested.' : 'Files approved.';

      const submitBtn = rq(card, '[data-act="revSubmit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        await api('POST', '/api/tasks/' + encodeURIComponent(id) + path, {
          notes,
          ratings: apiRatings,
        });
        await refreshTasks();
      } catch (err) {
        if (errEl) errEl.textContent = err.message || 'Submit Feedback failed';
        syncReviewActionButtons(card);
      }
    }

    function openLinkReplaceInline(card, t, index, mode) {

      const outcomes = linksWithOutcomes(t);
      const entry = outcomes[index];

      const stars = Number(entry.stars) || 0;
      if (mode === 'update' && stars !== 2) return;

      if (!row) return;
      closeAllLinkReplaceInlines(row);
      const box = row.querySelector('[data-f="linkReplace"]');
      if (!box) return;

      const commentRequired = mode === 'update';
      const outcome = row.querySelector('.link-outcome');
      if (outcome) outcome.hidden = true;

      box.hidden = false;
      box.innerHTML = ''

    async function saveLinkReplaceInline(card, t, index, mode) {
      if (!canUserLinkAct(t)) return;
      const row = card.querySelector('.task-links-compact-row[data-link-idx="' + index + '"]');
      const box = row && row.querySelector('[data-f="linkReplace"]');
      if (!box || box.hidden) return;
      const errEl = box.querySelector('[data-f="lriErr"]');
      const nameInp = box.querySelector('[data-f="lriName"]');
      const urlInp = box.querySelector('[data-f="lriUrl"]');
      const cmtInp = box.querySelector('[data-f="lriComment"]');
      const setErr = (msg) => {
        if (!errEl) return;
        errEl.hidden = !msg;
        errEl.textContent = msg || '';
      };

      const outcomes = linksWithOutcomes(t);
      const entry = outcomes[index];
      if (!entry) return;
      const stars = Number(entry.stars) || 0;
      if (mode === 'update' && stars !== 2) return;
      if (mode === 'edit' && stars !== 1) return;

      const newName = String(nameInp && nameInp.value || '').trim();
      if (!newName) {
        setErr('A file name is required.');
        if (nameInp) nameInp.focus();
        return;
      }
      const newUrl = normalizeUrlInput(urlInp && urlInp.value);
      if (!newUrl) {
        setErr('A valid URL is required.');
        return;
      }
      const userComment = cmtInp ? String(cmtInp.value || '').trim() : '';
      if (mode === 'update' && !userComment) {
        setErr('A comment is required for Update.');
        return;
      }

      const links = linksFromTask(t).map((l) => ({
        url: l.url,
        name: l.name || '',
        tag: l.tag || '',
        iter: Math.max(1, Number(l.iter) || 1),
      }));
      if (!links[index]) return;
      links[index] = {
        url: newUrl,
        name: newName,
        tag: links[index].tag || '',
        iter: links[index].iter + 1,
      };

      const saveBtn = box.querySelector('[data-act="linkReplaceSave"]');
      if (saveBtn) saveBtn.disabled = true;
      setErr('');
      try {
        // 3★ rows never reach here (mode/stars guards). Persist new URL, then
        // always re-open Needs review so admin sees the new version.
        const serialized = await persistTaskLinks(t.ref, links);
        try {
          await markNeedsReview(t.ref, serialized, userComment);
        } catch (revErr) {
          setErr(revErr.message || 'Needs review submit failed — file saved, but not re-opened for review');
          if (saveBtn) saveBtn.disabled = false;
          return;
        }
        await refreshTasks();
      } catch (err) {
        setErr(err.message || 'Could not save link');
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    function cancelLinkReplaceInline(row) {
      if (!row) return;
      const box = row.querySelector('[data-f="linkReplace"]');
      if (box) {
        box.hidden = true;
        box.innerHTML = '';
      }
      const outcome = row.querySelector('.link-outcome');
      if (outcome) outcome.hidden = false;
    }

    function openInlineEdit(el, t) {
      if (!el || !t) return;
      closeAllInlineReviews();
      closeInlineReview(el);
      closeAllInlineEdits(el);
      el.classList.add('editing');
      const body = el.querySelector('.edit-body');
      body.hidden = false;
      body.innerHTML = buildEditPanelHtml(t);

      const errEl = eq(el, '[data-f="err"]');
      if (errEl) errEl.textContent = '';

      const kindVal = applyKindToEditCard(el, t);
      const nameEl = eq(el, '[data-f="name"]');
      const nameRo = eq(el, '[data-f="nameRo"]');
      nameEl.value = t.name || '';
      nameRo.textContent = t.name || '';
      eq(el, '[data-f="desc"]').value = t.description || '';
      fillNotesField(el.querySelector('.edit-body') || el, notesTextFromTask(t));
      el.dataset.linksLocked = '';
      const editScopeEarly = el.querySelector('.edit-body') || el;
      fillLinkList(editScopeEarly, linksFromTask(t), { plain: true });
      markApprovedLinkRows(editScopeEarly, t);
      eq(el, '[data-f="projectRo"]').value = t.projectName || t.projectCode || '';
      eq(el, '[data-f="startRo"]').textContent = t.startDate || '—';
      eq(el, '[data-f="end"]').value = t.endDate || '';
      eq(el, '[data-f="endRo"]').textContent = t.endDate || '—';
      eq(el, '[data-f="priority"]').value = t.priority || 'normal';

      const stSel = eq(el, '[data-f="status"]');
      const curStatus = t.status || '';
      fillStatusSelect(stSel, t, { p2DoneLocked: role() === 'P2' && curStatus === 'Done' });

      if (t.stages && t.stages.tokens) {
        eq(el, '[data-f="stages"]').value = (t.stages.tokens || []).join(' ');
        eq(el, '[data-f="stageIdx"]').value = String(t.stages.currentIndex || 0);
      } else {
        eq(el, '[data-f="stages"]').value = '';
        eq(el, '[data-f="stageIdx"]').value = '0';
      }

      const scope = perms().editScope || 'none';
      const statusOnlyRole = scope === 'status';
      const restricted = isRestrictedKindVal(kindVal);
      const full = scope === 'all' || scope === 'own';
      const showReassign = canReassignRole();
      const showAdminKind = isAdminKindUi();
      const banner = eq(el, '[data-f="banner"]');

      function en(node, on) { if (node) node.disabled = !on; }

      if (restricted) {
        banner.hidden = false;
        banner.textContent = 'This kind only allows status changes.';
        // Hide content fields; keep admin kind/ms so they can switch back to Normal
        ['project','desc','notes','links','priority','parent','stages','start','end'].forEach((f) => setEditFld(el, f, false));
        setEditFld(el, 'ms', showAdminKind);
        setEditFld(el, 'kind', showAdminKind);
        setEditFld(el, 'name', true);
        nameEl.hidden = true;
        nameRo.hidden = false;
        setEditFld(el, 'status', true);
        en(stSel, true);
        setEditKindControlsEnabled(el, showAdminKind);
        if (p2DoneLocked) {
          en(stSel, false);
          banner.hidden = false;
          banner.textContent = isTaskCompletionApproved(t)
            ? 'Done — task Approved by admin (status locked).'
            : 'Done — Waiting for approval (status locked).';
        }
      } else {
        banner.hidden = true;
        setEditFld(el, 'project', false);
        setEditFld(el, 'name', !statusOnlyRole);
        setEditFld(el, 'desc', !statusOnlyRole);
        setEditFld(el, 'notes', !statusOnlyRole);
        setEditFld(el, 'links', !statusOnlyRole);
        setEditFld(el, 'start', true);
        setEditFld(el, 'end', true);
        setEditFld(el, 'status', true);
        setEditFld(el, 'priority', scope === 'all');
        setEditFld(el, 'ms', showAdminKind && !statusOnlyRole);
        setEditFld(el, 'kind', showAdminKind && !statusOnlyRole);
        setEditFld(el, 'parent', !statusOnlyRole);
        setEditFld(el, 'stages', !statusOnlyRole);
        nameEl.hidden = false;
        nameRo.hidden = true;
        en(nameEl, full && !statusOnlyRole);
        en(eq(el, '[data-f="desc"]'), full && !statusOnlyRole);
        setNotesEnabled(el.querySelector('.edit-body') || el, full && !statusOnlyRole);
        const linksOn = full && !statusOnlyRole;
        const editScope = el.querySelector('.edit-body') || el;
        const linkList = editScope.querySelector('[data-f="linkList"]');
        const addBtn = editScope.querySelector('[data-act="addLink"]');

          if (linkList) {

              row.querySelectorAll('[data-f="linkTag"], [data-act="rmLink"]').forEach((n) => {
                n.disabled = false;

          if (addBtn) {
            addBtn.hidden = false;
            syncAddLinkBtn(editScope);

        } else {
          if (addBtn) {
            addBtn.hidden = true;
            addBtn.disabled = true;
          }
          if (linkList) {
            linkList.querySelectorAll('[data-act="rmLink"]').forEach((n) => {
              n.disabled = true;
              n.hidden = true;
            });
          }
          cancelAddLinkInline(editScope);

        en(stSel, (full || statusOnlyRole) && !p2DoneLocked);
        if (p2DoneLocked) {
          banner.hidden = false;
          banner.textContent = isTaskCompletionApproved(t)
            ? 'Done — task Approved by admin (status locked).'
            : 'Done — Waiting for approval (status locked).';
        }
        en(eq(el, '[data-f="priority"]'), scope === 'all');
        const endEditable = full && !statusOnlyRole && curStatus !== 'Done';
        eq(el, '[data-f="end"]').hidden = !endEditable;
        eq(el, '[data-f="endRo"]').hidden = endEditable;
        if (!endEditable) {
          eq(el, '[data-f="endRo"]').textContent = (eq(el, '[data-f="end"]').value || t.endDate || '—');
        }
        en(eq(el, '[data-f="end"]'), endEditable);
        setEditKindControlsEnabled(el, showAdminKind && !statusOnlyRole && (full || !!perms().canSetKind));
        en(eq(el, '[data-f="parent"]'), full && !statusOnlyRole);
        en(eq(el, '[data-f="stages"]'), full && !statusOnlyRole);
        const stageInteractive = full && !statusOnlyRole;
        syncEditStagesUi(el, { interactive: stageInteractive, rewrite: true });

      setEditFld(el, 'reassign', showReassign);
      if (showReassign) {
        setEditAssigneeCur(el, t);
        fillEditAssigneeOptions(el, t.assigneeUsername || '');
        refreshUsers().then(() => fillEditAssigneeOptions(el, t.assigneeUsername || ''));
      }

      syncEditParentVisibility(el, t.parentRef || '');
      syncEditStagesVisibility(el);
      if (!restricted) {
        const stageInteractive = full && !statusOnlyRole;
        syncEditStagesUi(el, { interactive: stageInteractive, rewrite: true });
      }
    }

    async function submitInlineUpdate(card) {
      const errEl = eq(card, '[data-f="err"]');
      if (errEl) errEl.textContent = '';
      const id = card.dataset.ref;
      if (!id) {
        if (errEl) errEl.textContent = 'Missing task ref.';
        return;
      }
      const taskRow = (state.tasks || []).find((x) => x.ref === id)
        || (state.allForParent || []).find((x) => x.ref === id)
        || null;
      const stSel = eq(card, '[data-f="status"]');
      const liveKind = isAdminKindUi() ? resolvedEditKind(card) : null;
      let origKind = 'main';
      if (taskRow) {
        if (taskRow.kind) origKind = taskRow.kind;
        else if (taskRow.kindIcon === 'P') origKind = 'pseudo';
        else if (taskRow.kindIcon === 'R') origKind = 'routine';
        else if (taskRow.kindIcon === 'N') origKind = 'not_a_task';
        else if (taskRow.parentRef) origKind = 'sub';
      }
      const restrictedMode = isRestrictedKindVal(liveKind || origKind);
      try {
        if (restrictedMode) {
          const st = statusPayloadFromSel(stSel, taskRow);
          if (role() === 'P2' && !st) {
            errEl.textContent = p2StatusPickHint(taskRow);
            return;
          }
          const patch = { status: st || stSel.value };
          if (liveKind && liveKind !== origKind) patch.kind = liveKind;
          await api('PATCH', '/api/tasks/' + encodeURIComponent(id), patch);
        } else {
          const body = {};
          if (stSel && !stSel.disabled) {
            if (role() === 'P2' && stSel.value === 'Done' && !taskAllLinksReadyForDone(taskRow)) {
              errEl.textContent = 'Done needs every link rated 2★ or 3★.';
              return;
            }
            const st = statusPayloadFromSel(stSel, taskRow);
            if (st) body.status = st;
          }
          const nameEl = eq(card, '[data-f="name"]');
          if (nameEl && !nameEl.disabled) body.name = nameEl.value.trim();
          const descEl = eq(card, '[data-f="desc"]');
          if (descEl && !descEl.disabled) body.description = descEl.value;
          const notesScope = card.querySelector('.edit-body') || card;
          const notesTa = notesScope.querySelector('textarea[data-f="notes"]');
          if (notesTa && !notesTa.disabled) {
            body.notes = notesPayloadForSave(notesScope, taskRow);
          }
          const linksFld = notesScope.querySelector('[data-efld="links"]');
          if (linksFld && !linksFld.hidden) {
            const collected = collectLinksFromScope(notesScope);
            if (collected.some((l) => !String(l.name || '').trim())) {
              errEl.textContent = 'Every link needs a file name.';
              return;
            }
            body.link = serializeTaskLinks(collected);
          }
          const priEl = eq(card, '[data-f="priority"]');
          const priFld = eq(card, '[data-efld="priority"]');
          if (priEl && !priEl.disabled && priFld && !priFld.hidden) {
            body.priority = priEl.value;
          }
          const endEl = eq(card, '[data-f="end"]');
          if (endEl && !endEl.hidden && !endEl.disabled) {
            body.endDate = endEl.value.trim();
          }

          const msFld = eq(card, '[data-efld="ms"]');
          const parentSel = eq(card, '[data-f="parent"]');
          if (isAdminKindUi() && msFld && !msFld.hidden) {
            const k = resolvedEditKind(card);
            const orig = (state.tasks || []).find((x) => x.ref === id);
            let origKind = 'main';
            if (orig) {
              if (orig.kind) origKind = orig.kind;
              else if (orig.kindIcon === 'P') origKind = 'pseudo';
              else if (orig.kindIcon === 'R') origKind = 'routine';
              else if (orig.kindIcon === 'N') origKind = 'not_a_task';
              else if (orig.parentRef) origKind = 'sub';
            }
            // kind only when P3/P4 actually changed Main|Sub / kind radios
            if (k !== origKind) body.kind = k;
            if (k === 'sub') {
              if (!parentSel || !parentSel.value) {
                errEl.textContent = 'Select a Main parent task.'; return;
              }
              body.parentRef = parentSel.value;
            } else {
              body.parentRef = null;
            }
          } else if (parentSel && parentSel.value) {
            // P2 (and non-admin): parent alone — never send kind
            body.parentRef = parentSel.value;
          }

          if (body.kind && isRestrictedKindVal(body.kind)) {
            const st = body.status || statusPayloadFromSel(stSel, taskRow) || stSel.value;
            await api('PATCH', '/api/tasks/' + encodeURIComponent(id), {
              kind: body.kind,
              status: st,
            });
          } else {
            await api('PATCH', '/api/tasks/' + encodeURIComponent(id), body);
            const stagesEl = eq(card, '[data-f="stages"]');
            if (stagesEl && !stagesEl.disabled && editStagesAllowed(card)) {
              const check = parseStageTokensClient(stagesEl.value);
              if (!check.ok) {
                errEl.textContent = check.error;
                return;
              }
              const tokens = syncEditStagesUi(card, { rewrite: true, interactive: true, clearError: true });
              await api('PATCH', '/api/tasks/' + encodeURIComponent(id) + '/stages', {
                text: tokens.join(' '),
                currentIndex: Number(eq(card, '[data-f="stageIdx"]').value) || 0,
              });
            }
          }
        }
        if (!restrictedMode) {
          const notesScope = card.querySelector('.edit-body') || card;
          const linksFld = notesScope.querySelector('[data-efld="links"]');
          const collected = (linksFld && !linksFld.hidden)
            ? collectLinksFromScope(notesScope)
            : [];
          const linkStr = serializeTaskLinks(collected);
          // Re-open Needs review when any attached file is not yet 3★ (includes new adds).
          const needsSubmit = collected.some((l) => {
            const r = latestRatingForUrl(taskRow, l.url);
            return !r || Number(r.stars) !== 3;
          });
          if (linkStr && needsSubmit) {
            try {
              await markNeedsReview(id, linkStr);
            } catch (revErr) {
              if (errEl) {
                errEl.textContent = 'Saved, but Needs review failed: '
                  + (revErr && revErr.message ? revErr.message : 'submit error');
              }
              await refreshTasks();
              return;
            }
          }
        }
        await refreshTasks();
      } catch (err) {
        if (errEl) errEl.textContent = err.message;
      }
    }

    async function reassignFromCard(card) {
      const okEl = eq(card, '[data-f="reassignOk"]');
      const errEl = eq(card, '[data-f="reassignErr"]');
      if (okEl) okEl.textContent = '';
      if (errEl) errEl.textContent = '';
      if (!canReassignRole()) {
        if (errEl) errEl.textContent = 'only P3/P4 can reassign tasks';
        return;
      }
      const id = card.dataset.ref;
      const assigneeUsername = (eq(card, '[data-f="assignee"]') || {}).value;
      if (!id) {
        if (errEl) errEl.textContent = 'Missing task ref.';
        return;
      }
      if (!assigneeUsername) {
        if (errEl) errEl.textContent = 'Select a username to re-assign.';
        return;
      }
      try {
        const r = await api('PATCH', '/api/tasks/' + encodeURIComponent(id) + '/reassign', {
          assigneeUsername,
        });
        const task = r && r.task;
        if (task) {
          setEditAssigneeCur(card, task);
          fillEditAssigneeOptions(card, task.assigneeUsername || '');
          const idx = (state.tasks || []).findIndex((x) => x.ref === id);
          if (idx >= 0) {
            state.tasks[idx].assigneeUsername = task.assigneeUsername;
            state.tasks[idx].assigneeDisplayName = task.assigneeDisplayName;
          }
        }
        if (okEl) okEl.textContent = 'Assignee updated.';
        // stay in edit mode — refresh would collapse the panel
      } catch (err) {
        if (errEl) errEl.textContent = err.message;
      }
    }

    function onTaskListClick(e) {
      const card = e.target.closest('#taskList .task');
      if (!card) return;

      const linkAct = e.target.closest(
        '[data-act="linkUpdate"], [data-act="linkEdit"], [data-act="linkReplaceSave"], [data-act="linkReplaceCancel"]'
      );
      if (linkAct && card.querySelector('.task-compact') && card.querySelector('.task-compact').contains(linkAct)) {
        e.preventDefault();
        const t = (state.tasks || []).find((x) => x.ref === card.dataset.ref);
        if (!t) return;
        const a = linkAct.dataset.act;
        if (a === 'linkReplaceCancel') {
          cancelLinkReplaceInline(linkAct.closest('.task-links-compact-row'));
          return;
        }
        if (a === 'linkReplaceSave') {
          const idx = Number(linkAct.dataset.linkIdx);
          const mode = linkAct.dataset.mode === 'update' ? 'update' : 'edit';
          if (Number.isNaN(idx)) return;
          saveLinkReplaceInline(card, t, idx, mode);
          return;
        }
        const idx = Number(linkAct.dataset.linkIdx);
        if (Number.isNaN(idx)) return;
        openLinkReplaceInline(card, t, idx, a === 'linkUpdate' ? 'update' : 'edit');
        return;
      }

      if (card.classList.contains('reviewing')) {
        const revBody = card.querySelector('.review-body');
        const act = e.target.closest('[data-act]');
        if (act && revBody && revBody.contains(act)) {
          const a = act.dataset.act;
          if (a === 'revCancel') { closeInlineReview(card); return; }
          if (a === 'revSubmit') { submitInlineReview(card); return; }
          if (a === 'setStar') {
            e.preventDefault();
            const row = act.closest('.rev-link-row');
            setRevLinkStars(row, act.dataset.star);
            syncReviewActionButtons(card);
            return;
          }
        }
        return;
      }

      if (!card.classList.contains('editing')) return;
      const editScope = card.querySelector('.edit-body') || card;
      const act = e.target.closest('[data-act]');
      if (act && editScope.contains(act)) {
        const a = act.dataset.act;
        if (a === 'cancel') {
          closeInlineEdit(card);
          return;
        }
        if (a === 'update') { submitInlineUpdate(card); return; }
        if (a === 'reassign') { reassignFromCard(card); return; }
        if (a === 'addLink') {
          e.preventDefault();
          if (act.disabled) return;
          promptAddLink(editScope);
          return;
        }
        if (a === 'addLinkCancel') {
          e.preventDefault();
          cancelAddLinkInline(editScope);
          return;
        }
        if (a === 'addLinkSave') {
          e.preventDefault();
          saveAddLinkInline(editScope);
          return;
        }
        if (a === 'rmLink') {
          e.preventDefault();
          const row = act.closest('.task-link-row');
          if (!row || row.dataset.approved === '1' || act.disabled) return;
          row.remove();
          syncAddLinkBtn(editScope);
          return;
        }
        if (a === 'delete') {
          if (!confirm('Delete?')) return;
          (async () => {
            try {
              await api('DELETE', '/api/tasks/' + encodeURIComponent(card.dataset.ref));
              await refreshTasks();
            } catch (err) {
              const errEl = eq(card, '[data-f="err"]');
              if (errEl) errEl.textContent = err.message;
            }
          })();
          return;
        }
      }
      const msBtn = e.target.closest('.edit-ms .seg-btn');
      if (msBtn && !msBtn.disabled && card.querySelector('.edit-body').contains(msBtn)) {
        setEditMs(card, msBtn.dataset.ms);
        syncEditParentVisibility(card);
        syncEditStagesVisibility(card);
      }
    }

    function onTaskListChange(e) {
      const revCard = e.target.closest('#taskList .task.reviewing');
      if (revCard) {
        const revBody = revCard.querySelector('.review-body');
        if (revBody && revBody.contains(e.target)
            && (e.target.matches('[data-f="revTag"]') || e.target.matches('[data-f="revComment"]'))) {
          syncReviewActionButtons(revCard);
        }
        return;
      }
      const card = e.target.closest('#taskList .task.editing');
      if (!card) return;
      if (!card.querySelector('.edit-body').contains(e.target)) return;
      if (e.target.matches('input[data-f="kind"]')) {
        const t = (state.tasks || []).find((x) => x.ref === card.dataset.ref)
          || (state.allForParent || []).find((x) => x.ref === card.dataset.ref)
          || null;
        applyEditModeFromKind(card, t);
        syncEditParentVisibility(card);
        syncEditStagesVisibility(card);
      }
      if (e.target.matches('[data-f="stages"]')) syncEditStagesUi(card);
    }

    function onTaskListInput(e) {
      const revCard = e.target.closest('#taskList .task.reviewing');
      if (revCard) {
        const revBody = revCard.querySelector('.review-body');
        if (revBody && revBody.contains(e.target)
            && (e.target.matches('[data-f="revComment"]') || e.target.matches('[data-f="revTag"]'))) {
          syncReviewActionButtons(revCard);
        }
        return;
      }
      const card = e.target.closest('#taskList .task.editing');
      if (!card) return;
      if (!card.querySelector('.edit-body').contains(e.target)) return;
      if (e.target.matches('[data-f="stages"]')) syncEditStagesUi(card);
      if (e.target.matches('textarea[data-f="notes"]')) {
        scheduleNotesUi(card.querySelector('.edit-body') || card);
      }
    }

    function onTaskListScroll(e) {
      const card = e.target.closest('#taskList .task.editing');
      if (!card) return;
      if (!e.target.matches('textarea[data-f="notes"]')) return;
      if (!card.querySelector('.edit-body').contains(e.target)) return;
      const scope = card.querySelector('.edit-body') || card;
      const wrap = scope.querySelector('.notes-smart');
      if (wrap && wrap.classList.contains('notes-editing')) return;
      const backdrop = scope.querySelector('[data-f="notesBackdrop"]');
      if (backdrop) syncNotesBackdrop(e.target, backdrop);
    }

    function onTaskListFocusIn(e) {
      const card = e.target.closest('#taskList .task.editing');
      if (!card) return;
      if (!e.target.matches('textarea[data-f="notes"]')) return;
      if (!card.querySelector('.edit-body').contains(e.target)) return;
      setNotesEditing(card.querySelector('.edit-body') || card, true);
    }

    function onTaskListFocusOut(e) {
      const card = e.target.closest('#taskList .task.editing');
      if (!card) return;
      if (!e.target.matches('textarea[data-f="notes"]')) return;
      if (!card.querySelector('.edit-body').contains(e.target)) return;
      setNotesEditing(card.querySelector('.edit-body') || card, false);
    }

    function onTaskListBlur(e) {
      const card = e.target.closest('#taskList .task.editing');
      if (!card) return;
      if (!card.querySelector('.edit-body').contains(e.target)) return;
      if (e.target.matches('[data-f="stages"]')) {
        syncEditStagesUi(card, { rewrite: true });
      }
    }

    // events
    $('btnLogin').onclick = () => { $('loginErr').textContent = ''; $('loginDlg').showModal(); };
    $('loginCancel').onclick = () => $('loginDlg').close();
    $('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const r = await api('POST', '/api/login', { username: $('lu').value.trim(), password: $('lp').value });
        setAuth(r.token, r.csrfToken); $('loginDlg').close(); await boot();
      } catch (err) { $('loginErr').textContent = err.message; }
    };
    $('btnLogout').onclick = async () => {
      try { await api('POST', '/api/logout', {}); } catch (e) {}
      setAuth(null, null); clearAllDummies(); await boot();
    };
    $('btnAddDraft').onclick = () => addDummyDraft();
    $('draftList').addEventListener('click', onDraftListClick);
    $('draftList').addEventListener('change', onDraftListChange);
    $('draftList').addEventListener('input', onDraftListInput);
    $('draftList').addEventListener('focusin', onDraftListFocusIn);
    $('draftList').addEventListener('focusout', onDraftListFocusOut);
    $('draftList').addEventListener('focusout', onDraftListBlur);
    $('draftList').addEventListener('scroll', onDraftListScroll, true);
    $('taskList').addEventListener('click', onTaskListClick);
    $('taskList').addEventListener('change', onTaskListChange);
    $('taskList').addEventListener('input', onTaskListInput);
    $('taskList').addEventListener('focusin', onTaskListFocusIn);
    $('taskList').addEventListener('focusout', onTaskListFocusOut);
    $('taskList').addEventListener('focusout', onTaskListBlur);
    $('taskList').addEventListener('scroll', onTaskListScroll, true);

    document.getElementById('tabs').onclick = (e) => {
      const t = e.target.closest('.tab'); if (t) switchView(t.dataset.view);
    };
    $('logRefresh').onclick = () => refreshLogs().catch((e) => alert(e.message));
    $('journeyFetch').onclick = async () => {
      const ref = ($('journeyRef').value || '').trim();
      if (!ref) { alert('Enter a task ref'); return; }
      $('journeyOut').textContent = 'Loading…';
      try {
        const r = await api('GET', '/api/reports/journey?ref=' + encodeURIComponent(ref));
        $('journeyOut').textContent = JSON.stringify(r, null, 2);
      } catch (e) {
        $('journeyOut').textContent = e.message || 'Failed';
      }
    };
    $('logCsv').onclick = () => {
      const rows = state.logs || [];
      const cols = ['ref','name','projectCode','assigneeUsername','status','reviewState','stagesSummary','link','updatedAt'];
      const lines = [cols.join(',')].concat(rows.map((r) => cols.map((c) => JSON.stringify(r[c] == null ? '' : r[c])).join(',')));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'logs.csv'; a.click();
    };

    ['Draft', 'Active', 'Blocked', 'Pause', 'Done'].forEach((s) => {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = s;
      $('logStatus').appendChild(o);
    });

    async function syncStagingBanner() {
      const el = $('stagingBanner');
      if (!el) return;
      try {
        const h = await api('GET', '/api/health');
        const b = h && h.banner;
        if (!b || !b.staging) {
          el.hidden = true;
          return;
        }
        el.hidden = false;
        el.textContent = b.message || 'Staging';
        el.classList.toggle('is-writes', !!b.stagingWrites);
      } catch (err) {
        el.hidden = true;
      }
    }

    async function boot() {
      try {
        await syncStagingBanner();
        await refreshMe(); await refreshProjects();
        if (!state.me) clearAllDummies();
        await refreshTasks();
      } catch (err) { $('hint').textContent = 'Could not load: ' + err.message; }
    }
    boot();
  })();
  </script>
</body>
</html>
