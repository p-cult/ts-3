        <button class="btn" type="button" onclick="window.print()">Print</button>
      </div>
      <div id="logList"></div>
    </div>
  </main>

  <dialog id="loginDlg">
    <form class="dlg" id="loginForm" method="dialog">
      <h2>Log in</h2>
      <p class="muted">Primary: ts3admin / ts3-98860 (P4) · ts3usr1 / ts3-98860 (P2)</p>
      <label>Username</label><input id="lu" autocomplete="username" required />
      <label>Password</label><input id="lp" type="password" autocomplete="current-password" required />
      <div class="err" id="loginErr"></div>
      <div class="row">
        <button class="btn primary" type="submit">Sign in</button>
        <button class="btn" type="button" id="loginCancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script>
  (function () {
    const TOKEN_KEY = 'ts3_token', CSRF_KEY = 'ts3_csrf';
    const state = {
      me: null, permissions: null, tasks: [], hierarchy: null, projects: [], users: [],
      view: 'board', logs: [], allForParent: [], attentionCount: 0,
    };
    const $ = (id) => document.getElementById(id);

    function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
    function getCsrf() { try { return localStorage.getItem(CSRF_KEY); } catch (e) { return null; } }
    function setAuth(token, csrf) {
      try {
        if (token) localStorage.setItem(TOKEN_KEY, token); else localStorage.removeItem(TOKEN_KEY);
        if (csrf) localStorage.setItem(CSRF_KEY, csrf); else localStorage.removeItem(CSRF_KEY);
      } catch (e) {}
    }

    async function api(method, path, body) {
      const headers = { Accept: 'application/json' };
      const tok = getToken();
      if (tok) headers.Authorization = 'Bearer ' + tok;
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      if (method !== 'GET' && method !== 'HEAD' && path !== '/api/login') {
        const c = getCsrf(); if (c) headers['X-CSRF-Token'] = c;
      }
      const res = await fetch(path, { method, headers, credentials: 'same-origin', body: body !== undefined ? JSON.stringify(body) : undefined });
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        const err = new Error((data && data.error && data.error.message) || res.statusText);
        err.status = res.status; throw err;
      }
      return data;
    }

    function role() { return (state.me && state.me.role) || 'P1'; }
    function perms() { return state.permissions || {}; }
    function canReassignRole() { const r = role(); return r === 'P3' || r === 'P4'; }
    /** LOCKED: Main|Sub toggle + kind radios visible for P3/P4 only */
    function isAdminKindUi() { const r = role(); return r === 'P3' || r === 'P4'; }

    const IST_MONTH_IX = Object.freeze({
      Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
      Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11,
    });

    /** Exact display: "DD-MMM | HH:MM" in Asia/Kolkata. */
    function formatIstStamp(date) {
      const d = date instanceof Date ? date : new Date(date);
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Kolkata',
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).formatToParts(d);
      const get = (t) => {
        const p = parts.find((x) => x.type === t);
        return p ? p.value : '';
      };
      let hour = get('hour');
      if (hour === '24') hour = '00';
      return get('day') + '-' + get('month') + ' | ' + hour + ':' + get('minute');
    }

    function istNowStamp() { return formatIstStamp(new Date()); }

    function istYearNow() {
      return Number(new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Kolkata', year: 'numeric',
      }).format(new Date()));
    }

    function parseIstStamp(str) {
      const m = String(str || '').trim().match(/^(\d{2})-([A-Za-z]{3})\s*\|\s*(\d{2}):(\d{2})$/);
      if (!m) return null;
      const mon = IST_MONTH_IX[m[2]];
      if (mon == null) return null;
      const y = istYearNow();
      const mm = String(mon + 1).padStart(2, '0');
      const iso = y + '-' + mm + '-' + m[1] + 'T' + m[3] + ':' + m[4] + ':00+05:30';
      const d = new Date(iso);
      return isNaN(d.getTime()) ? null : d;
    }

    function addHoursToIstStamp(stamp, hours) {
      const d = parseIstStamp(stamp);
      const base = d || new Date();
      return formatIstStamp(new Date(base.getTime() + hours * 3600000));
    }

    function defaultEndFromStart(startStamp) {
      return addHoursToIstStamp(startStamp || istNowStamp(), 24);
    }

    /**
     * Done is allowed only when every link is rated 2★ or 3★.
     * No links → Done stays off (nothing rated).
     */
    function taskAllLinksReadyForDone(t) {
      const links = linksFromTask(t);
      if (!links.length) return false;
      return links.every((l) => {
        const r = latestRatingForUrl(t, l.url);
        const stars = r ? Number(r.stars) || 0 : 0;
        return stars === 2 || stars === 3;
      });
    }

    /** API status token for “working / resumed” — never show this string in the UI. */
    const STATUS_API_RESUME = 'Resume';

    /**
     * User-visible status label. Maps the API resume token → “Active”.
     */
    function statusDisplayLabel(status) {
      const st = String(status || '').trim();
      if (st === STATUS_API_RESUME) return 'Active';
      return st || '—';
    }

    /** Append a <option> whose visible text never exposes the API resume token. */
    function appendStatusOption(sel, apiValue, extraLabel) {
      if (!sel) return null;
      const o = document.createElement('option');
      o.value = apiValue;
      o.textContent = statusDisplayLabel(apiValue) + (extraLabel || '');
      sel.appendChild(o);
      return o;
    }

    /**
     * Status choices by role (API values).
     * P2: Pause | resume-token | Done (gated); Done locked → [].
     * Admin: Draft | Active | Blocked | Pause | Done — never a second Active/Resume pair.
     */
    function statusChoicesForRole(t) {
      if (role() === 'P2') {
        const cur = String((t && t.status) || '');
        if (cur === 'Done') return [];
        const out = cur === 'Pause' ? [STATUS_API_RESUME] : ['Pause'];
        if (t && taskAllLinksReadyForDone(t)) out.push('Done');
        return out;
      }
      return ['Draft', 'Active', 'Blocked', 'Pause', 'Done'];
    }

    /**
     * API value for a displayed status choice.
     * Prefer real Active; keep resume token only while the task is already on it.
     */
    function statusOptionApiValue(choice, t) {
      const cur = String((t && t.status) || '');
      if (choice === 'Active' && cur === STATUS_API_RESUME) return STATUS_API_RESUME;
      return choice;
    }

    /** Fill status <select> with one label per choice (single Active). */
    function fillStatusSelect(sel, t, opts) {
      opts = opts || {};
      if (!sel) return;
      sel.innerHTML = '';
      const curStatus = String((t && t.status) || '');
      const statuses = statusChoicesForRole(t);
      const p2DoneLocked = !!opts.p2DoneLocked;

      if (p2DoneLocked || (role() === 'P2' && curStatus && statuses.indexOf(curStatus) < 0
          && curStatus !== STATUS_API_RESUME)) {
        const o = appendStatusOption(sel, curStatus, p2DoneLocked ? ' (locked)' : ' (current)');
        if (o) {
          o.disabled = true;
          o.selected = true;
        }
      }
      // P2 on resume token with Pause|Done choices: show Active (current) stub
      if (role() === 'P2' && curStatus === STATUS_API_RESUME && statuses.indexOf(STATUS_API_RESUME) < 0) {
        const o = appendStatusOption(sel, STATUS_API_RESUME, ' (current)');
        if (o) {
          o.disabled = true;
          o.selected = true;
        }
      }

      const existing = () => new Set([...sel.options].map((o) => o.value));
      statuses.forEach((choice) => {
        const apiVal = statusOptionApiValue(choice, t);
        if (existing().has(apiVal)) return;
        appendStatusOption(sel, apiVal);
      });

      if (curStatus === STATUS_API_RESUME) {
        const activeOpt = [...sel.options].find((o) => o.value === STATUS_API_RESUME || o.value === 'Active');
        if (activeOpt) sel.value = activeOpt.value;
      } else if (existing().has(curStatus)) {
        sel.value = curStatus;
      }
    }

    /** True when the selected status is one P2 is allowed to POST/PATCH. */
    function p2MaySendStatus(uiStatus, t) {
      const cur = String((t && t.status) || '');
      if (cur === 'Done') return false; // cannot revoke Done
      if (uiStatus === 'Pause') return cur !== 'Pause';
      if (uiStatus === STATUS_API_RESUME) return cur === 'Pause';
      if (uiStatus === 'Done') return !!(t && taskAllLinksReadyForDone(t));
      return false;
    }

    /** Status value to send, or null to omit (P2 left on system-current stub). */
    function statusPayloadFromSel(sel, t) {
      if (!sel) return null;
      const ui = sel.value;
      if (role() === 'P2') return p2MaySendStatus(ui, t) ? ui : null;
      return ui;
    }

    /** Hint when P2 must pick a status transition (restricted / status-only save). */
    function p2StatusPickHint(t) {
      const cur = String((t && t.status) || '');
      if (cur === 'Done') return 'Status is Done and locked.';
      const doneOk = !!(t && taskAllLinksReadyForDone(t));
      if (cur === 'Pause') {
        return doneOk
          ? 'Choose Active or Done.'
          : 'Choose Active (Done needs every link at 2★ or 3★).';
      }
      return doneOk
        ? 'Choose Pause or Done.'
        : 'Choose Pause (Done needs every link at 2★ or 3★).';
    }

    /**
     * Task-level completion approval (Done → admin Approve → Approved tag).
     * Completely separate from file 3★ / reviewState.
     * Marker lives in notes and/or review feedback history (P3 can write feedback only).
     */
    const TASK_APPROVED_MARK = '⟦TASK_APPROVED⟧';

    function notesWithoutTaskApprovalMark(notes) {
      return String(notes == null ? '' : notes)
        .split('\n')
        .filter((line) => line.indexOf(TASK_APPROVED_MARK) < 0)
        .join('\n')
        .replace(/^\n+|\n+$/g, '');
    }

    function notesWithTaskApprovalMark(notes) {
      const base = notesWithoutTaskApprovalMark(notes);
      return base ? (base + '\n' + TASK_APPROVED_MARK) : TASK_APPROVED_MARK;
    }

    function textHasTaskApprovalMark(text) {
      return String(text == null ? '' : text).indexOf(TASK_APPROVED_MARK) >= 0;
    }

    /** True when admin has approved this Done task’s completion. */
    function isTaskCompletionApproved(t) {
      if (!t) return false;
      if (textHasTaskApprovalMark(t.notes)) return true;
      if (t.review && textHasTaskApprovalMark(t.review.lastNotes)) return true;
      const hist = t.review && t.review.history;
      if (Array.isArray(hist)) {
        for (let i = 0; i < hist.length; i++) {
          if (textHasTaskApprovalMark(hist[i] && hist[i].notes)) return true;
        }
      }
      return false;
    }

    function canApproveTaskCompletion(t) {
      return !!(t
        && perms().canReviewModerate
        && String(t.status || '') === 'Done'
        && !isTaskCompletionApproved(t)
        && (t.kind === 'main' || t.kind === 'sub' || !t.kindIcon));
    }

    async function approveTaskCompletion(t) {
      if (!canApproveTaskCompletion(t)) throw new Error('Cannot approve this task');
      const ref = t.ref;
      await api('POST', '/api/tasks/' + encodeURIComponent(ref) + '/review/feedback', {
        notes: TASK_APPROVED_MARK + ' Task completion approved.',
      });
      // P4 can also persist on notes for list durability; P3 relies on history enrichment.
      if (perms().editScope === 'all') {
        await api('PATCH', '/api/tasks/' + encodeURIComponent(ref), {
          notes: notesWithTaskApprovalMark(t.notes),
        });
      }
    }

    /** Fetch history/notes for Done tasks so completion-approval markers are visible. */
    async function enrichDoneCompletionApprovals(tasks) {
      const list = Array.isArray(tasks) ? tasks : [];
      const need = list.filter((t) => (
        String(t.status || '') === 'Done' && !isTaskCompletionApproved(t)
      ));
      if (!need.length) return list;
      await Promise.all(need.map(async (t) => {
        try {
          const d = await api('GET', '/api/tasks/' + encodeURIComponent(t.ref));
          const detail = d && d.task;
          if (!detail) return;
          if (detail.notes != null) t.notes = detail.notes;
          if (detail.review) t.review = detail.review;
          if (detail.reviewState != null) t.reviewState = detail.reviewState;
        } catch (e) { /* keep list row */ }
      }));
      return list;
    }

    function nest(tasks) {
      const byId = new Map((tasks || []).map((t) => [t.ref, { ...t, children: [] }]));
      const roots = [];
      byId.forEach((t) => {
        if (t.parentRef && byId.has(t.parentRef)) byId.get(t.parentRef).children.push(t);
        else roots.push(t);
      });
      return roots;
    }

    function renderBar(st) {
      if (!st || !st.total) return '';
      const pct = Math.round((st.ratio || 0) * 100);
      return '<div class="bar" title="Stages ' + st.currentIndex + '/' + st.total + '"><i style="width:' + pct + '%"></i></div>';
    }

    function shortRef(ref) {
      const r = String(ref || '');
      return r.length > 10 ? r.slice(0, 8) + '…' : r;
    }

    /** Links are explicit entries (max 4). Notes is text-only — never mined for URLs. */
    const MAX_LINKS = 4;

    function normalizeUrlInput(raw) {
      let u = String(raw || '').trim().replace(/[.,);:\]]+$/g, '');
      if (!u) return '';
      if (/^www\./i.test(u)) u = 'https://' + u;
      return u;
    }

    function normalizeLinkEntry(x) {
      if (x && typeof x === 'object') {
        const url = normalizeUrlInput(x.url || x.href || '');
        if (!url) return null;
        // Ignore legacy stars/revTag/revComment/comments mirrored into link JSON.
        // iter = per-file version (independent across links on the same task).
        const iter = Math.max(1, parseInt(x.iter, 10) || 1);
        const name = String(x.name != null ? x.name : '').trim();
        return {
          url,
          name,
          tag: String(x.tag != null ? x.tag : '').trim(),
          iter,
        };
      }
      const url = normalizeUrlInput(x);
      return url ? { url, name: '', tag: '', iter: 1 } : null;
    }

    function parseTaskLinks(raw) {
      if (Array.isArray(raw)) {
        return raw.map(normalizeLinkEntry).filter(Boolean).slice(0, MAX_LINKS);
      }
      const s = String(raw == null ? '' : raw).trim();
      if (!s) return [];
      if (s.charAt(0) === '[') {
        try {
          const parsed = JSON.parse(s);
          if (Array.isArray(parsed)) {
            return parsed.map(normalizeLinkEntry).filter(Boolean).slice(0, MAX_LINKS);
          }
        } catch (e) { /* fall through */ }
      }
      return s.split(/\r?\n+/).map(normalizeLinkEntry).filter(Boolean).slice(0, MAX_LINKS);
    }

    function serializeTaskLinks(arr) {
      const links = (Array.isArray(arr) ? arr : [])
        .map(normalizeLinkEntry)
        .filter(Boolean)
        .slice(0, MAX_LINKS);
      if (!links.length) return '';
      return JSON.stringify(links.map((l) => ({
        url: l.url,
        name: l.name || '',
        tag: l.tag || '',
        iter: Math.max(1, Number(l.iter) || 1),
      })));
    }

    const REVIEW_PRESET_TAGS = [
      'Incomplete',
      'Needs polish',
      'Wrong format',
      'Broken / inaccessible',
      'Unclear',
      'Other',
    ];

    /** Per-file version label: v1, v2, … (never a shared task-wide number). */
    function linkFileVersionLabel(entryOrIter) {
      const n = (entryOrIter && typeof entryOrIter === 'object')
        ? Math.max(1, Number(entryOrIter.iter) || 1)
        : Math.max(1, Number(entryOrIter) || 1);
      return 'v' + n;
    }

    /** Resolve iter for a URL from a link field snapshot (history.linkAtReview). */
    function linkIterFromLinkField(linkField, url) {
      if (!url) return 0;
      const hit = parseTaskLinks(linkField).find((l) => l.url === url);
      return hit ? Math.max(1, Number(hit.iter) || 1) : 0;
    }

    /**
     * Per-file iter at a history entry: prefer iter embedded in linkAtReview;
     * else count how many submit snapshots already included this URL (1-based).
     */
    function historyFileIter(t, entry, url) {
      const fromSnap = linkIterFromLinkField(entry && entry.linkAtReview, url);
      if (fromSnap) return fromSnap;
      const hist = (t && t.review && t.review.history) || [];
      let count = 0;
      for (let i = 0; i < hist.length; i++) {
        const e = hist[i];
        if (String((e && e.action) || '').toLowerCase() === 'submit') {
          const urls = parseTaskLinks(e && e.linkAtReview).map((l) => l.url);
          if (urls.indexOf(url) >= 0) count += 1;
        }
        if (entry && e === entry) break;
        if (entry && e && entry.at && e.at === entry.at
          && String(entry.action || '') === String(e.action || '')
          && String(entry.byUsername || '') === String(e.byUsername || '')) break;
      }
      return Math.max(1, count || 1);
    }

    /** Normalize one API rating row: { url, stars, tag?, comment? }. */
    function normalizeApiRating(r) {
      if (!r || typeof r !== 'object') return null;
      const url = normalizeUrlInput(r.url || '');
      const stars = Number(r.stars) || 0;
      if (!url || stars < 1 || stars > 3) return null;
      return {
        url,
        stars,
        tag: String(r.tag != null ? r.tag : (r.revTag || '')).trim(),
        comment: String(r.comment != null ? r.comment : (r.revComment || '')).trim(),
      };
    }

    /**
     * Latest rating for one URL: prefer review.lastRatings, else newest history
     * entry that rates this exact url. No index fallback across files.
     */
    function latestRatingForUrl(t, url) {
      const u = normalizeUrlInput(url);
      if (!u) return null;
      const last = t && t.review && t.review.lastRatings;
      if (Array.isArray(last) && last.length) {
        for (let i = 0; i < last.length; i++) {
          const r = normalizeApiRating(last[i]);
          if (r && r.url === u) return r;
        }
      }
      const hist = t && t.review && t.review.history;
      if (Array.isArray(hist)) {
        for (let i = hist.length - 1; i >= 0; i--) {
          const rs = hist[i] && hist[i].ratings;
          if (!Array.isArray(rs) || !rs.length) continue;
          for (let j = 0; j < rs.length; j++) {
            const r = normalizeApiRating(rs[j]);
            if (r && r.url === u) return r;
          }
        }
      }
      return null;
    }

    /**
     * Star outcomes live only on the review API:
     * prefer review.lastRatings, else latest history entry that has ratings.
     * (Flat list helper — prefer latestRatingForUrl for per-file decisions.)
     */
    function taskApiRatings(t) {
      const last = t && t.review && t.review.lastRatings;
      if (Array.isArray(last) && last.length) {
        const out = last.map(normalizeApiRating).filter(Boolean);
        if (out.length) return out;
      }
      const hist = t && t.review && t.review.history;
      if (Array.isArray(hist)) {
        for (let i = hist.length - 1; i >= 0; i--) {
          const rs = hist[i] && hist[i].ratings;
          if (!Array.isArray(rs) || !rs.length) continue;
          const out = rs.map(normalizeApiRating).filter(Boolean);
          if (out.length) return out;
        }
      }
      return [];
    }

    /** True when API review ratings exist for any link — EDIT must not freely mutate links. */
    function taskHasStarRatings(t) {
      return linksFromTask(t).some((l) => !!latestRatingForUrl(t, l.url));
    }

    /** Merge task links with per-URL API ratings (never borrow another file's stars by index). */
    function linksWithOutcomes(t) {
      const links = linksFromTask(t);
      const ratedAt = taskRatingsAt(t);
      return links.map((l) => {
        const r = latestRatingForUrl(t, l.url);
        return {
          url: l.url,
          name: l.name || '',
          tag: l.tag || '',
          iter: Math.max(1, Number(l.iter) || 1),
          stars: r ? r.stars : 0,
          revTag: r ? r.tag : '',
          revComment: r ? r.comment : '',
          ratedAt: r ? (linkStarRatedAt(t, l.url, r.stars) || ratedAt) : '',
        };
      });
    }

    /** Timestamp for the review entry that currently supplies ratings. */
    function taskRatingsAt(t) {
      const last = t && t.review && t.review.lastRatings;
      if (Array.isArray(last) && last.length && t.review.lastAt) return t.review.lastAt;
      const hist = t && t.review && t.review.history;
      if (Array.isArray(hist)) {
        for (let i = hist.length - 1; i >= 0; i--) {
          const rs = hist[i] && hist[i].ratings;
          if (Array.isArray(rs) && rs.length) return hist[i].at || '';
        }
      }
      return '';
    }

    /** Latest history `at` for a url+stars rating (e.g. 3★ Approved stamp). */
    function linkStarRatedAt(t, url, stars) {
      const want = Number(stars) || 0;
      const hist = t && t.review && t.review.history;
      if (!Array.isArray(hist)) return '';
      for (let i = hist.length - 1; i >= 0; i--) {
        const rs = hist[i] && hist[i].ratings;
        if (!Array.isArray(rs)) continue;
        for (let j = 0; j < rs.length; j++) {
          const r = normalizeApiRating(rs[j]);
          if (r && r.url === url && (!want || r.stars === want)) return hist[i].at || '';
        }
      }
      return '';
    }

    function syncAddLinkBtn(scope) {
      if (!scope) return;
      const list = scope.querySelector('[data-f="linkList"]');
      const btn = scope.querySelector('[data-act="addLink"]');
      if (!btn || !list) return;
      const n = list.querySelectorAll('.task-link-row').length;
      const atMax = n >= MAX_LINKS;
      btn.disabled = atMax;
      btn.hidden = false;
      if (atMax) cancelAddLinkInline(scope);
    }

    /**
     * Mark 3★ rows in the EDIT link list; they stay non-removable.
     * Add link remains available (until max 4).
     */
    function markApprovedLinkRows(scope, t) {
      if (!scope) return;
      const list = scope.querySelector('[data-f="linkList"]');
      if (!list) return;
      list.querySelectorAll('.task-link-row').forEach((row) => {
        const url = row.dataset.url || '';
        const r = latestRatingForUrl(t, url);
        const approved = !!(r && r.stars === 3);
        row.dataset.approved = approved ? '1' : '';
        row.classList.toggle('is-approved-lock', approved);
      });
      applyApprovedLinkRowLocks(scope);
    }

    /** Lock only 3★ rows; never hide/disable Add link due to approvals. */
    function applyApprovedLinkRowLocks(scope) {
      if (!scope) return;
      const list = scope.querySelector('[data-f="linkList"]');
      const hint = scope.querySelector('[data-f="linksLockHint"]');
      let hasApproved = false;
      if (list) {
        list.querySelectorAll('.task-link-row').forEach((row) => {
          const locked = row.dataset.approved === '1';
          if (locked) hasApproved = true;
          const rm = row.querySelector('[data-act="rmLink"]');
          if (rm) {
            rm.hidden = locked;
            rm.disabled = locked;
          }
          row.querySelectorAll('[data-f="linkTag"]').forEach((inp) => {
            inp.readOnly = locked;
            inp.disabled = locked;
          });
        });
      }
      const addBtn = scope.querySelector('[data-act="addLink"]');
      if (addBtn) {
        addBtn.hidden = false;
        syncAddLinkBtn(scope);
      }
      if (hint) hint.hidden = !hasApproved;
    }

    function shortLinkName(url) {
      try {
        const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
        const u = new URL(href);
        let name = u.hostname.replace(/^www\./i, '');
        if (u.pathname && u.pathname !== '/') {
          const seg = u.pathname.replace(/\/+$/, '').split('/').pop();
          if (seg) name = decodeURIComponent(seg);
        }
        name = String(name || url);
        return name.length > 22 ? name.slice(0, 20) + '…' : name;
      } catch (e) {
        const s = String(url || '');
        return s.length > 22 ? s.slice(0, 20) + '…' : s;
      }
    }

    /** Display label for a link: given name, else legacy URL-derived short name (never raw URL). */
    function linkDisplayName(entry) {
      const given = entry && entry.name != null ? String(entry.name).trim() : '';
      if (given) return given;
      return shortLinkName((entry && entry.url) || '');
    }

    /** Resolve stored name for a URL from a link snapshot or current task. */
    function linkNameForUrl(t, url, linkField) {
      if (!url) return '';
      if (linkField != null) {
        const hit = parseTaskLinks(linkField).find((l) => l.url === url);
        if (hit && hit.name) return hit.name;
      }
      const cur = linksFromTask(t).find((l) => l.url === url);
      if (cur && cur.name) return cur.name;
      return '';
    }

    function linkFileType(url) {
      const s = String(url || '').split(/[?#]/)[0].toLowerCase();
      if (/\.pdf$/i.test(s)) return 'pdf';
      if (/\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i.test(s)) return 'img';
      if (/\.(docx?|rtf|txt|md|odt)$/i.test(s)) return 'doc';
      return 'link';
    }

    function notesTextFromTask(t) {
      // Hide task-completion marker from the notes editor.
      return notesWithoutTaskApprovalMark((t && t.notes) ? String(t.notes) : '');
    }

    function notesPayloadForSave(scope, t) {
      const edited = getNotesValue(scope);
      if (t && isTaskCompletionApproved(t)) return notesWithTaskApprovalMark(edited);
      return edited;
    }

    function linksFromTask(t) {
      return parseTaskLinks(t && t.link);
    }

    function linkUrlsFromTask(t) {
      return linksFromTask(t).map((l) => l.url);
    }

    function taskHasAnyLink(t) {
      return linksFromTask(t).length > 0;
    }

    /**
     * Mark under_review via /review/submit (required for Needs review tab).
     * Throws on failure — callers must surface the error (do not pretend success).
     */
    async function markNeedsReview(ref, linkSerialized, notes) {
      if (!ref) throw new Error('Missing task ref for review submit');
      const link = String(linkSerialized || '').trim();
      if (!link) throw new Error('Link is required to submit for review');
      if (!perms().canReviewSubmit) {
        throw new Error('You cannot submit tasks for review');
      }
      const body = { link };
      const n = notes != null ? String(notes).trim() : '';
      if (n) body.notes = n;
      return api('POST', '/api/tasks/' + encodeURIComponent(ref) + '/review/submit', body);
    }

    /** Character-identical decorative HTML — bullets only (no URL mining). */
    function formatNotesBackdrop(text) {
      const s = String(text == null ? '' : text);
      return s.split('\n').map((line) => {
        const bullet = /^([-*]\s)/.exec(line);
        if (bullet) {
          return '<span class="note-bullet-mark"><span class="note-bullet-src">'
            + escapeHtml(bullet[1]) + '</span></span>'
            + escapeHtml(line.slice(bullet[1].length));
        }
        return escapeHtml(line);
      }).join('\n');
    }

    function syncNotesBackdrop(ta, backdrop) {
      if (!ta || !backdrop) return;
      const val = ta.value;
      if (backdrop.dataset.notesVal !== val) {
        backdrop.dataset.notesVal = val;
        backdrop.innerHTML = formatNotesBackdrop(val);
      }
      backdrop.style.width = ta.clientWidth + 'px';
      backdrop.style.transform = 'translateY(' + (-(ta.scrollTop || 0)) + 'px)';
    }

    function syncNotesUi(scope, opts) {
      opts = opts || {};
      if (!scope) return;
      const wrap = scope.querySelector('.notes-smart');
      const ta = scope.querySelector('textarea[data-f="notes"]');
      const backdrop = scope.querySelector('[data-f="notesBackdrop"]');
      if (!ta) return;
      const editing = !!(wrap && wrap.classList.contains('notes-editing'));
      if (!editing || opts.forceBackdrop) syncNotesBackdrop(ta, backdrop);
    }

    const notesUiRaf = new WeakMap();
    function scheduleNotesUi(scope) {
      if (!scope) return;
      if (notesUiRaf.has(scope)) return;
      const id = requestAnimationFrame(() => {
        notesUiRaf.delete(scope);
        syncNotesUi(scope);
      });
      notesUiRaf.set(scope, id);
    }

    function setNotesEditing(scope, on) {
      if (!scope) return;
      const wrap = scope.querySelector('.notes-smart');
      if (!wrap) return;
      wrap.classList.toggle('notes-editing', !!on);
      if (!on) syncNotesUi(scope, { forceBackdrop: true });
    }

    function setNotesEnabled(scope, on) {
      if (!scope) return;
      const ta = scope.querySelector('textarea[data-f="notes"]');
      if (ta) ta.disabled = !on;
    }

    function fillNotesField(scope, text) {
      if (!scope) return;
      const ta = scope.querySelector('textarea[data-f="notes"]');
      if (!ta) return;
      ta.value = text == null ? '' : String(text);
      const backdrop = scope.querySelector('[data-f="notesBackdrop"]');
      if (backdrop) delete backdrop.dataset.notesVal;
      const wrap = scope.querySelector('.notes-smart');
      if (wrap) wrap.classList.remove('notes-editing');
      syncNotesUi(scope, { forceBackdrop: true });
    }

    function getNotesValue(scope) {
      const ta = scope && scope.querySelector('textarea[data-f="notes"]');
      return ta ? ta.value : '';
    }

    function notesFieldHtml() {
      return ''
        + '<div class="fld" data-dfld="notes" data-efld="notes">'
        + '<label>Notes</label>'
        + '<p class="hint-sm">Text only. Lines starting with - or * become bullets when you leave the field.</p>'
        + '<div class="notes-smart">'
        + '<div class="notes-backdrop" data-f="notesBackdrop" aria-hidden="true"></div>'
        + '<textarea data-f="notes" rows="5" placeholder="" spellcheck="true" aria-label="Notes"></textarea>'
        + '</div>'
        + '</div>';
    }

    function linksFieldHtml() {
      return ''
        + '<div class="fld task-links-fld" data-dfld="links" data-efld="links">'
        + '<label>Links <span class="muted">(max ' + MAX_LINKS + ')</span></label>'
        + '<div class="task-link-list" data-f="linkList"></div>'
        + '<button type="button" class="btn" data-act="addLink">Add link</button>'
        + '<div class="add-link-inline" data-f="addLinkInline" hidden>'
        + '<input type="text" data-f="addLinkName" placeholder="File name (required)" maxlength="80" autocomplete="off" />'
        + '<input type="url" data-f="addLinkUrl" placeholder="https://" autocomplete="off" />'
        + '<button type="button" class="btn primary" data-act="addLinkSave">Add</button>'
        + '<button type="button" class="btn" data-act="addLinkCancel">Cancel</button>'
        + '<p class="lri-err" data-f="addLinkErr" hidden></p>'
        + '</div>'
        + '<p class="hint-sm" data-f="linksHint">Name + URL. The name is what everyone sees (clickable).</p>'
        + '<p class="hint-sm" data-f="linksLockHint" hidden>'
        + 'Rated files are locked here — use Submit Revision on the card for 1★/2★ changes.</p>'
        + '</div>';
    }

    function linkOpenHtml(entry) {
      const url = String((entry && entry.url) || '').replace(/"/g, '');
      const ft = linkFileType(url);
      const label = linkDisplayName(entry);
      return '<a class="task-link-open" href="' + url + '" target="_blank" rel="noopener" title="'
        + escapeHtml(url) + '">'
        + '<span class="task-link-ft is-' + ft + '" aria-hidden="true"></span>'
        + '<span class="task-link-label">' + escapeHtml(label) + '</span>'
        + '</a>';
    }

    /**
     * Link row for draft/edit lists.
     * opts.plain — EDIT panel: icon + name (+ vN) + remove only; no tags/outcomes.
     */
    function buildLinkRowEl(entry, opts) {
      opts = opts || {};
      const row = document.createElement('div');
      row.className = 'task-link-row';
      const url = (entry && entry.url) || '';
      const name = String((entry && entry.name) || '').trim() || shortLinkName(url);
      row.dataset.url = url;
      row.dataset.name = name;
      row.dataset.iter = String(Math.max(1, Number(entry && entry.iter) || 1));
      const displayEntry = { url, name, tag: (entry && entry.tag) || '', iter: entry && entry.iter };
      if (opts.plain) {
        row.innerHTML = linkOpenHtml(displayEntry)
          + '<span class="task-link-iter">' + escapeHtml(linkFileVersionLabel(entry)) + '</span>'
          + '<button type="button" class="btn" data-act="rmLink" title="Remove link">×</button>';
        return row;
      }
      row.innerHTML = linkOpenHtml(displayEntry)
        + '<span class="task-link-iter">' + escapeHtml(linkFileVersionLabel(entry)) + '</span>'
        + '<input class="task-link-tag" data-f="linkTag" type="text" placeholder="tag / comment" maxlength="80" />'
        + '<button type="button" class="btn" data-act="rmLink" title="Remove link">×</button>';
      const tag = row.querySelector('[data-f="linkTag"]');
      if (tag) tag.value = (entry && entry.tag) || '';
      return row;
    }

    function collectLinksFromScope(scope) {
      if (!scope) return [];
      const rows = scope.querySelectorAll('[data-f="linkList"] .task-link-row');
      const out = [];
      rows.forEach((row) => {
        if (out.length >= MAX_LINKS) return;
        const url = normalizeUrlInput(row.dataset.url || '');
        if (!url) return;
        const tagEl = row.querySelector('[data-f="linkTag"]');
        out.push({
          url,
          name: String(row.dataset.name || '').trim(),
          tag: tagEl ? tagEl.value.trim() : '',
          iter: Math.max(1, Number(row.dataset.iter) || 1),
        });
      });
      return out;
    }

    function fillLinkList(scope, links, opts) {
      if (!scope) return;
      const list = scope.querySelector('[data-f="linkList"]');
      if (!list) return;
      list.innerHTML = '';
      const entries = Array.isArray(links) ? links : parseTaskLinks(links);
      opts = opts || {};
      entries.forEach((entry) => list.appendChild(buildLinkRowEl(entry, opts)));
      syncAddLinkBtn(scope);
    }

    function addLinkRow(scope, entry) {
      if (!scope) return false;
      const list = scope.querySelector('[data-f="linkList"]');
      if (!list) return false;
      if (list.querySelectorAll('.task-link-row').length >= MAX_LINKS) {
        syncAddLinkBtn(scope);
        return false;
      }
      const normalized = normalizeLinkEntry(entry);
      if (!normalized) return false;
      // Match EDIT plain rows (icon + name + ×); draft keeps tags.
      const sample = list.querySelector('.task-link-row');
      const plain = sample
        ? !sample.querySelector('[data-f="linkTag"]')
        : !!(scope.classList && scope.classList.contains('edit-body'));
      list.appendChild(buildLinkRowEl(normalized, { plain }));
      syncAddLinkBtn(scope);
      return true;
    }

    function promptAddLink(scope) {
      if (!scope) return;
      const list = scope.querySelector('[data-f="linkList"]');
      if (!list) return;
      if (list.querySelectorAll('.task-link-row').length >= MAX_LINKS) {
        syncAddLinkBtn(scope);
        return;
      }
      const box = scope.querySelector('[data-f="addLinkInline"]');
      const nameInp = scope.querySelector('[data-f="addLinkName"]');
      const urlInp = scope.querySelector('[data-f="addLinkUrl"]');
      const errEl = scope.querySelector('[data-f="addLinkErr"]');
      const addBtn = scope.querySelector('[data-act="addLink"]');
      if (!box || !urlInp) return;
      if (errEl) { errEl.hidden = true; errEl.textContent = ''; }
      box.hidden = false;
      if (addBtn) addBtn.hidden = true;
      if (nameInp) nameInp.value = '';
      urlInp.value = 'https://';
      if (nameInp) nameInp.focus();
      else { urlInp.focus(); urlInp.select(); }
    }

    function cancelAddLinkInline(scope) {
      if (!scope) return;
      const box = scope.querySelector('[data-f="addLinkInline"]');
      const nameInp = scope.querySelector('[data-f="addLinkName"]');
      const urlInp = scope.querySelector('[data-f="addLinkUrl"]');
      const errEl = scope.querySelector('[data-f="addLinkErr"]');
      const addBtn = scope.querySelector('[data-act="addLink"]');
      if (box) box.hidden = true;
      if (nameInp) nameInp.value = '';
      if (urlInp) urlInp.value = '';
      if (errEl) { errEl.hidden = true; errEl.textContent = ''; }
      if (addBtn) {
        addBtn.hidden = false;
        syncAddLinkBtn(scope);
      }
    }

    function saveAddLinkInline(scope) {
      if (!scope) return;
      const nameInp = scope.querySelector('[data-f="addLinkName"]');
      const urlInp = scope.querySelector('[data-f="addLinkUrl"]');
      const errEl = scope.querySelector('[data-f="addLinkErr"]');
      const name = String(nameInp && nameInp.value || '').trim();
      const url = normalizeUrlInput(urlInp && urlInp.value);
      if (!name) {
        if (errEl) {
          errEl.hidden = false;
          errEl.textContent = 'A file name is required.';
        }
        if (nameInp) nameInp.focus();
        return;
      }
      if (!url) {
        if (errEl) {
          errEl.hidden = false;
          errEl.textContent = 'Enter a valid URL.';
        }
        return;
      }
      if (!addLinkRow(scope, { url, name, tag: '', iter: 1 })) {
        if (errEl) {
          errEl.hidden = false;
          errEl.textContent = 'Link limit reached (max ' + MAX_LINKS + ').';
        }
        return;
      }
      cancelAddLinkInline(scope);
    }

    /** Permanent 3★ line: name · vN · DD-MMM | HH:MM · Approved · “comment?” */
    function approvedLinkLineHtml(entry) {
      const ver = linkFileVersionLabel(entry);
      let when = '—';
      if (entry && entry.ratedAt) {
        try {
          const d = new Date(entry.ratedAt);
          if (!Number.isNaN(d.getTime())) when = formatIstStamp(d);
        } catch (e) { /* keep — */ }
      }
      const comment = entry && entry.revComment ? String(entry.revComment).trim() : '';
      const cmt = comment ? ' · “' + escapeHtml(comment) + '”' : '';
      return '<p class="link-approved-line">'
        + linkOpenHtml(entry)
        + ' · ' + escapeHtml(ver)
        + ' · ' + escapeHtml(when)
        + ' · <span class="la-status">Approved</span>'
        + cmt
        + '</p>';
    }

    function taskLinksCompactHtml(t) {
      const arr = linksWithOutcomes(t);
      if (!arr.length) return '';
      const rState = normalizeUiReviewState(t);
      const showOutcomes = role() !== 'P1';
      const canAct = canUserLinkAct(t);
      return '<div class="task-links-compact">'
        + arr.map((l, idx) => {
          const stars = Number(l.stars) || 0;
          const ver = linkFileVersionLabel(l);
          const rowCls = 'task-links-compact-row'
            + (showOutcomes && stars ? ' is-' + stars : '')
            + (showOutcomes && stars === 1 && rState === 'rework' ? ' is-rework' : '');

          // 3★: permanent read-only text — never Edit/Update again
          if (showOutcomes && stars === 3) {
            return '<div class="' + rowCls + '" data-link-idx="' + idx + '">'
              + approvedLinkLineHtml(l)
              + '</div>';
          }

          const ownerTag = (!stars && l.tag)
            ? '<span class="task-link-tag-ro" title="' + escapeHtml(l.tag) + '">'
              + escapeHtml(l.tag) + '</span>'
            : '';
          return '<div class="' + rowCls + '" data-link-idx="' + idx + '">'
            + linkOpenHtml(l)
            + '<span class="task-link-iter">' + escapeHtml(ver) + '</span>'
            + ownerTag
            + (showOutcomes ? linkOutcomeHtml(l, rState, { canAct: canAct && !!stars, index: idx }) : '')
            + '<div class="link-replace-inline" data-f="linkReplace" hidden></div>'
            + linkCommentHistoryHtml(t, l)
            + '</div>';
        }).join('')
        + '</div>';
    }

    function canUserLinkAct(t) {
      return !!(state.me && t && t.assigneeUsername
        && t.assigneeUsername === state.me.username);
    }

    /**
     * Admin Review button: show when under_review or any file is 1★/2★.
     * Hide when every file is 3★, or status is Done with all files at 2★/3★.
     */
    function taskNeedsAdminReview(t) {
      if (!t || !taskHasAnyLink(t)) return false;
      const links = linksFromTask(t);
      if (!links.length) return false;
      let any12 = false;
      let all3 = true;
      let allDoneOk = true;
      links.forEach((l) => {
        const r = latestRatingForUrl(t, l.url);
        const stars = r ? Number(r.stars) || 0 : 0;
        if (stars === 1 || stars === 2) any12 = true;
        if (stars !== 3) all3 = false;
        if (stars !== 2 && stars !== 3) allDoneOk = false;
      });
      if (String(t.status || '') === 'Done' && allDoneOk) return false;
      if (all3) return false;
      const rState = normalizeUiReviewState(t);
      if (rState === 'under_review') return true;
      if (any12) return true;
      return false;
    }

    /**
     * Needs attention (P2 + admin): action still required.
     * Includes Done tasks waiting for task-level Approve (not yet Approved).
     */
    function taskNeedsAttention(t) {
      if (!t) return false;
      if (String(t.status || '') === 'Done') {
        return !isTaskCompletionApproved(t); // waiting for Approve task
      }
      const rState = normalizeUiReviewState(t);
      // under_review covers newly submitted files awaiting first rating
      if (rState === 'under_review' || rState === 'rework') return true;
      const links = linksFromTask(t);
      for (let i = 0; i < links.length; i++) {
        const r = latestRatingForUrl(t, links[i].url);
        const stars = r ? Number(r.stars) || 0 : 0;
        if (stars === 1 || stars === 2) return true; // user must act
      }
      return false;
    }

    /** Newest added first, then soonest / past deadline. */
    function sortTasksNeedsAttention(tasks) {
      return (Array.isArray(tasks) ? tasks.slice() : []).sort((a, b) => {
        const ca = Date.parse(a && a.createdAt) || Date.parse(a && a.updatedAt) || 0;
        const cb = Date.parse(b && b.createdAt) || Date.parse(b && b.updatedAt) || 0;
        if (cb !== ca) return cb - ca;
        const ea = parseIstStamp(a && a.endDate);
        const eb = parseIstStamp(b && b.endDate);
        const ma = ea ? ea.getTime() : Number.POSITIVE_INFINITY;
        const mb = eb ? eb.getTime() : Number.POSITIVE_INFINITY;
        if (ma !== mb) return ma - mb;
        return String((a && a.name) || '').localeCompare(String((b && b.name) || ''));
      });
    }

    function syncNeedsAttentionBadge(count) {
      const n = Math.max(0, Number(count) || 0);
      state.attentionCount = n;
      const tab = $('tabNeeds');
      const badge = $('tabNeedsCount');
      if (!badge) return;
      if (!tab || tab.hidden || n < 1) {
        badge.hidden = true;
        badge.textContent = '0';
        return;
      }
      badge.hidden = false;
      badge.textContent = n > 99 ? '99+' : String(n);
    }

    /** Comment trail from review history ratings (not link JSON). */
    function linkCommentHistoryHtml(t, linkEntry) {
      const url = linkEntry && linkEntry.url;
      const items = [];
      const hist = t && t.review && t.review.history;
      if (Array.isArray(hist)) {
        hist.forEach((entry) => {
          const ratings = Array.isArray(entry.ratings) ? entry.ratings : [];
          ratings.forEach((raw) => {
            const r = normalizeApiRating(raw);
            if (!r || !r.comment) return;
            if (url && r.url !== url) return;
            items.push({
              text: r.comment,
              at: entry.at || '',
              by: entry.byUsername || 'admin',
              kind: 'admin',
            });
          });
          const action = String(entry.action || '').toLowerCase();
          const notes = String(entry.notes || '').trim();
          if ((action === 'feedback' || action === 'submit') && notes
              && !Array.isArray(entry.ratings)) {
            items.push({
              text: notes,
              at: entry.at || '',
              by: entry.byUsername || '',
              kind: action === 'feedback' ? 'user' : 'admin',
            });
          }
        });
      } else if (linkEntry && linkEntry.revComment) {
        items.push({
          text: linkEntry.revComment,
          at: '',
          by: 'admin',
          kind: 'admin',
        });
      }
      if (!items.length) return '';
      return '<ul class="link-comment-hist" aria-label="Comment history">'
        + items.map((c) => {
          const when = c.at ? ' · ' + formatHistWhen(c.at) : '';
          return '<li>'
            + '<span class="lch-who lch-kind-' + escapeHtml(c.kind) + '">'
            + escapeHtml(c.by || c.kind) + '</span>'
            + '<span class="hist-meta">' + escapeHtml(when) + '</span>'
            + '<span class="lch-text">' + escapeHtml(c.text) + '</span>'
            + '</li>';
        }).join('')
        + '</ul>';
    }

    function linkOutcomeHtml(entry, rState, opts) {
      opts = opts || {};
      const stars = Number(entry && entry.stars) || 0;
      if (stars < 1 || stars > 3) return '';
      const tag = (entry && entry.revTag) ? String(entry.revTag) : '';
      const comment = (entry && entry.revComment) ? String(entry.revComment) : '';
      const canAct = !!opts.canAct;
      const idx = opts.index != null ? opts.index : '';

      if (stars === 3) {
        // EDIT panel preview: same permanent text; never actionable
        return approvedLinkLineHtml(entry);
      }

      if (stars === 2) {
        const tagHtml = tag
          ? '<span class="link-outcome-tag" title="Admin tag">' + escapeHtml(tag) + '</span>'
          : '<span class="link-outcome-status">Ready for task Done</span>';
        const btn = canAct
          ? '<span class="link-user-actions">'
            + '<button type="button" class="btn" data-act="linkUpdate" data-link-idx="'
            + idx + '">Update</button></span>'
          : '';
        return '<p class="link-outcome is-2">' + tagHtml + btn + '</p>';
      }

      // 1★
      const tagHtml = tag
        ? '<span class="link-outcome-tag">' + escapeHtml(tag) + '</span>'
        : '';
      const commentHtml = comment
        ? '<span class="link-outcome-comment">' + escapeHtml(comment) + '</span>'
        : '';
      const btn = canAct
        ? '<span class="link-user-actions">'
          + '<button type="button" class="btn" data-act="linkEdit" data-link-idx="'
          + idx + '">Edit</button></span>'
        : '';
      const reworkCls = rState === 'rework' ? ' is-rework' : '';
      return '<p class="link-outcome is-1' + reworkCls + '">'
        + '<span class="link-outcome-status">Needs changes</span>'
        + tagHtml + commentHtml + btn
        + '</p>';
    }

    function isMainCard(t, isSub) {
      if (isSub) return false;
      if (!t || !t.ref) return false;
      if (t.kind === 'sub') return false;
      if (t.parentRef) return false;
      if (t.kindIcon) return false; // P / R / N
      if (t.kind === 'pseudo' || t.kind === 'routine' || t.kind === 'not_a_task') return false;
      return true; // kind === main or equivalent structure task
    }

    function isSubDone(s) {
      // Subs “done” count uses task.status only — never reviewState/file approval.
      return String((s && s.status) || '') === 'Done';
    }

    /** Flat board tasks only — never nest children[] or the parent-picker cache. */
    function tasksByRef() {
      const map = new Map();
      (state.tasks || []).forEach((t) => {
        if (t && t.ref) map.set(String(t.ref), t);
      });
      return map;
    }

    /**
     * Pure view calc: direct Subs only (parentRef === this Main’s ref).
     * Y = total direct Subs; X = how many of those are done. Always X <= Y.
     */
    function subDoneStats(main) {
      if (!main || !main.ref) return { x: 0, y: 0 };
      const mainRef = String(main.ref);
      const list = [];
      tasksByRef().forEach((t) => {
        if (!t || !t.ref) return;
        if (String(t.ref) === mainRef) return;
        if (String(t.parentRef || '') !== mainRef) return;
        list.push(t);
      });
      const y = list.length;
      let x = list.filter(isSubDone).length;
      if (x > y) x = y;
      return { x, y };
    }

    function normalizeUiReviewState(t) {
      const s = String((t && t.review && t.review.state) || (t && t.reviewState) || 'none').toLowerCase();
      return s || 'none';
    }

    /**
     * File-review chip only (API reviewState). Never task completion “Approved”.
     * When reviewState is approved: no chip — per-file 3★ lines carry “Approved”.
     */
    function reviewChipInfo(t) {
      const s = normalizeUiReviewState(t);
      if (s === 'rework') return { label: 'files:Rework', cls: 'rev-rework' };
      if (s === 'under_review') return { label: 'files:Needs review', cls: 'rev-needs' };
      return null;
    }

    function latestReworkNotes(t) {
      if (normalizeUiReviewState(t) !== 'rework') return '';
      const fromReview = t && t.review && t.review.lastNotes != null ? String(t.review.lastNotes) : '';
      return fromReview.trim();
    }

    /** Task status chip — API resume token always displays as Active. */
    function taskStatusChipLabel(t) {
      const st = String((t && t.status) || '').trim();
      return st ? ('status:' + statusDisplayLabel(st)) : 'status:—';
    }

    function renderTask(t, isSub) {
      const el = document.createElement('article');
      el.className = 'task' + (isSub ? ' sub' : '');
      el.dataset.ref = t.ref || '';
      const kindChip = t.kindIcon ? '<span class="chip kind">' + t.kindIcon + '</span>' : '';
      const rState = normalizeUiReviewState(t);
      const iter = (t.review && t.review.iteration != null) ? t.review.iteration : (t.reviewIteration || 0);
      const isNeeds = state.view === 'needs';
      const reworkNotes = latestReworkNotes(t);

      let reviewHtml = '';
      if (role() !== 'P1') {
        if (rState === 'rework') {
          reviewHtml = '<div class="rework-notes">'
            + '<span class="rework-notes-label">Rework notes'
            + (iter ? ' · iteration ' + iter : '')
            + '</span>'
            + '<div class="rework-notes-body">'
            + (reworkNotes
              ? escapeHtml(reworkNotes)
              : '<span class="muted">No notes were provided.</span>')
            + '</div></div>';
        } else if (t.review && t.review.showOnDetail !== false && rState === 'under_review' && t.review.lastNotes) {
          reviewHtml = '<div class="review-box">' + escapeHtml(t.review.lastNotes) + '</div>';
        }
        // reviewState=approved: no task-level banner; per-file 3★ lines show Approved
      }

      el.innerHTML =
        '<div class="task-compact">'
        + '<h3></h3><div class="meta"></div><div class="subs-line" hidden></div><div class="chips"></div>'
        + taskLinksCompactHtml(t)
        + renderBar(t.stages) + reviewHtml + '<div class="actions"></div>'
        + '<div class="history-body" hidden></div>'
        + '</div><div class="edit-body" hidden></div><div class="review-body" hidden></div>';

      el.querySelector('h3').textContent = t.name || '';
      el.querySelector('.meta').textContent =
        (t.projectName || t.projectCode) + ' · ' + (t.assigneeDisplayName || t.assigneeUsername || '')
        + (t.startDate ? ' · start ' + t.startDate : '')
        + (t.endDate ? ' · end ' + t.endDate : '')
        + (iter && role() !== 'P1' && isNeeds ? ' · iter ' + iter : '');
      if (isMainCard(t, isSub)) {
        const stats = subDoneStats(t);
        const line = el.querySelector('.subs-line');
        line.hidden = false;
        line.textContent = stats.y === 0
          ? 'No subs'
          : ('Subs: ' + stats.x + '/' + stats.y + ' done');
      }
      const chips = el.querySelector('.chips');
      if (kindChip) chips.insertAdjacentHTML('beforeend', kindChip);
      const statusChip = document.createElement('span');
      statusChip.className = 'chip chip-status';
      statusChip.textContent = taskStatusChipLabel(t);
      chips.appendChild(statusChip);
      // Task-level completion approval (Done only) — not file review.
      if (role() !== 'P1' && String(t.status || '') === 'Done') {
        const doneChip = document.createElement('span');
        if (isTaskCompletionApproved(t)) {
          doneChip.className = 'chip chip-task-approved';
          doneChip.textContent = 'Approved';
          doneChip.title = 'Task completion approved by admin (not file review)';
        } else {
          doneChip.className = 'chip chip-waiting';
          doneChip.textContent = 'Waiting for approval';
          doneChip.title = 'Status is Done — waiting for P3/P4 to approve the task';
        }
        chips.appendChild(doneChip);
      }
      if (role() !== 'P1') {
        const revChip = reviewChipInfo(t);
        if (revChip) {
          const s = document.createElement('span');
          s.className = 'chip ' + revChip.cls;
          s.textContent = revChip.label;
          s.title = 'File review state (not task status)';
          chips.appendChild(s);
        }
      }
      const actions = el.querySelector('.actions');
      const scope = perms().editScope || 'none';
      const mine = state.me && t.assigneeUsername === state.me.username;
      const canEdit = scope === 'all' || scope === 'status' || (scope === 'own' && mine);

      if (canEdit) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
        b.textContent = 'EDIT'; b.dataset.act = 'edit';
        b.onclick = () => openInlineEdit(el, t); actions.appendChild(b);
      }
      // Review: P3/P4 only when action is still needed
      const canMod = !!perms().canReviewModerate;
      if (canMod && taskNeedsAdminReview(t)
          && (t.kind === 'main' || t.kind === 'sub' || !t.kindIcon)) {
        const rb = document.createElement('button'); rb.type = 'button';
        rb.className = 'btn' + (isNeeds ? ' primary' : '');
        rb.textContent = 'Review'; rb.dataset.act = 'review';
        rb.onclick = () => openInlineReview(el, t); actions.appendChild(rb);
      }
      // Task completion approval: P3/P4 on Done tasks still waiting
      if (canApproveTaskCompletion(t)) {
        const ab = document.createElement('button');
        ab.type = 'button';
        ab.className = 'btn primary';
        ab.textContent = 'Approve task';
        ab.dataset.act = 'approveTask';
        ab.onclick = () => {
          (async () => {
            try {
              ab.disabled = true;
              await approveTaskCompletion(t);
              await refreshTasks();
            } catch (err) {
              ab.disabled = false;
              alert(err.message || 'Approve task failed');
            }
          })();
        };
        actions.appendChild(ab);
      }
      // History: assignee + moderators (P2+)
      if (role() !== 'P1' && (taskHasAnyLink(t) || rState !== 'none' || String(t.status || '') === 'Done')) {
        const hb = document.createElement('button');
        hb.type = 'button';
        hb.className = 'btn';
        hb.textContent = 'History';
        hb.dataset.act = 'history';
        hb.onclick = () => toggleTaskHistory(el, t);
        actions.appendChild(hb);
      }
      return el;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function renderBoard() {
      const box = $('taskList'); box.innerHTML = '';
      const roots = nest(state.tasks);
      const canDraft = !!(state.me && perms().canCreate && state.view === 'board');
      $('empty').hidden = !!roots.length || canDraft || ($('draftList') && $('draftList').children.length > 0);
      if (state.view === 'needs') {
        $('hint').textContent = 'Needs attention: rework, pending ratings, 1★/2★ files, and Done waiting for Approve task. Sorted newest first, then soonest deadline.';
      } else if (state.view === 'completed') {
        $('hint').textContent = 'Completed: Done tasks already Approved. Waiting for Approve task stays on Needs attention. Board never shows Done.';
      } else if (role() === 'P1') {
        $('hint').textContent = 'Public: main tasks with nested subs. Link icon opens work in a new tab when present.';
      } else if (role() === 'P2') {
        $('hint').textContent = 'Your tasks (not Done). Use Needs attention for rework, pending review, and Done waiting approval.';
      } else if (role() === 'P3') {
        $('hint').textContent = 'Board: open work. Needs attention lists review work and Done tasks waiting for Approve task.';
      } else {
        $('hint').textContent = 'Admin board (not Done). Needs attention covers under review, rework, 1★/2★, and Done waiting approval.';
      }
      function walk(list, sub) {
        list.forEach((t) => {
          box.appendChild(renderTask(t, sub));
          if (t.children && t.children.length) walk(t.children, true);
        });
      }
      walk(roots, false);
      syncDraftBar();
    }

    function renderLogs() {
      const box = $('logList'); box.innerHTML = '';
      (state.logs || []).forEach((l) => {
        const el = document.createElement('div'); el.className = 'log-row';
        el.innerHTML = '<strong></strong> <span class="meta"></span><div class="chips"></div>';
        el.querySelector('strong').textContent = l.name;
        el.querySelector('.meta').textContent =
          l.projectCode + ' · ' + l.assigneeDisplayName + ' · status:' + statusDisplayLabel(l.status)
          + (l.stagesSummary ? ' · stages ' + l.stagesSummary : '')
          + (l.reviewState && l.reviewState !== 'none' && l.reviewState !== 'approved'
            ? ' · files:' + l.reviewState : '');
        if (l.kindIcon) {
          const c = document.createElement('span'); c.className = 'chip kind'; c.textContent = l.kindIcon;
          el.querySelector('.chips').appendChild(c);
        }
        if (l.hasLink || linksFromTask(l).length) {
          linksFromTask(l).forEach((entry) => {
            const a = document.createElement('a');
            a.className = 'chip';
            a.href = entry.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.title = entry.url;
            a.textContent = linkDisplayName(entry);
            el.querySelector('.chips').appendChild(a);
          });
        }
        box.appendChild(el);
      });
    }

    async function refreshMe() {
      const m = await api('GET', '/api/me');
      state.me = m.user; state.permissions = m.permissions;
      if (m.user) {
        $('whoLine').textContent = m.user.displayName + ' · ' + m.role;
        $('btnLogin').hidden = true; $('btnLogout').hidden = false;
        $('tabLogs').hidden = !perms().canViewLogs;
        $('reportsPanel').hidden = !perms().canViewReports;
        // Needs attention: P2 + P3/P4 (any signed-in user)
        $('tabNeeds').hidden = false;
        $('tabDone').hidden = false;
      } else {
        $('whoLine').textContent = 'Public (P1)';
        $('btnLogin').hidden = false; $('btnLogout').hidden = true;
        $('tabLogs').hidden = true;
        $('reportsPanel').hidden = true;
        $('tabNeeds').hidden = true;
        $('tabDone').hidden = true;
        syncNeedsAttentionBadge(0);
        if (state.view !== 'board') switchView('board');
      }
      syncDraftBar();
    }

    function boardQuery() {
      // Always full scoped list; filter Board / Needs attention / Completed client-side.
      return 'nested=1';
    }

    function filterTasksForView(tasks) {
      const list = Array.isArray(tasks) ? tasks : [];
      if (state.view === 'completed') {
        // Only Done + task-level Approved (Done waiting → Needs attention)
        return list.filter((t) => String(t.status || '') === 'Done' && isTaskCompletionApproved(t));
      }
      if (state.view === 'board') {
        return list.filter((t) => String(t.status || '') !== 'Done');
      }
      if (state.view === 'needs') {
        return sortTasksNeedsAttention(list.filter(taskNeedsAttention));
      }
      return list;
    }

    async function refreshTasks() {
      if (state.view === 'logs') return;
      const r = await api('GET', '/api/tasks?' + boardQuery());
      let all = r.tasks || [];
      // Enrich Done rows so “waiting approval” vs Approved is accurate for Needs attention badge.
      await enrichDoneCompletionApprovals(all);
      const attention = all.filter(taskNeedsAttention);
      syncNeedsAttentionBadge(attention.length);
      state.tasks = filterTasksForView(all);
      state.hierarchy = null;
      state.allForParent = all.filter((t) => String(t.status || '') !== 'Done');
      renderBoard();
    }

    // —— Multiple collapsible dummy drafts (frontend-only until SUBMIT) ——
    let draftSeq = 0;

    function canShowDrafts() {
      return !!(state.me && perms().canCreate && state.view === 'board');
    }

    function clearAllDummies() {
      const list = $('draftList');
      if (list) list.innerHTML = '';
    }

    function syncDraftBar() {
      const show = canShowDrafts();
      if ($('draftBar')) $('draftBar').hidden = !show;
      if ($('draftList')) $('draftList').hidden = !show;
      if (!show) return;
      // refresh project options inside existing dummies without wiping typed values
      document.querySelectorAll('#draftList .task.draft').forEach((card) => {
        refreshDummyProjects(card);
        syncDummyParentVisibility(card);
        syncDummyStagesVisibility(card);
      });
    }

    function dq(card, sel) { return card.querySelector(sel); }

    function getDummyMs(card) {
      return (dq(card, '[data-f="ms"]') && dq(card, '[data-f="ms"]').value) || 'main';
    }
    function setDummyMs(card, v) {
      const ms = v === 'sub' ? 'sub' : 'main';
      dq(card, '[data-f="ms"]').value = ms;
      card.querySelectorAll('.draft-ms .seg-btn').forEach((b) => {
        b.classList.toggle('on', b.dataset.ms === ms);
      });
    }
    function getDummyKindRadio(card) {
      const el = card.querySelector('input[data-f="kind"]:checked');
      return (el && el.value) || 'normal';
    }
    function resolvedDummyKind(card) {
      const kr = getDummyKindRadio(card);
      if (kr === 'pseudo') return 'pseudo';
      if (kr === 'routine') return 'routine';
      return getDummyMs(card) === 'sub' ? 'sub' : 'main';
    }
    function dummyStagesAllowed(card) {
      const msFld = dq(card, '[data-dfld="ms"]');
      if (isAdminKindUi() && msFld && !msFld.hidden) return getDummyKindRadio(card) === 'normal';
      return true;
    }

    function fillDummyParentOptions(card, selectedId) {
      const sel = dq(card, '[data-f="parent"]');
      const hint = dq(card, '[data-f="parentHint"]');
      const prev = selectedId != null ? selectedId : sel.value;
      sel.innerHTML = '';
      const opt0 = document.createElement('option');
      opt0.value = ''; opt0.textContent = '— Select a Main —';
      sel.appendChild(opt0);
      const mains = (state.allForParent || []).filter((t) => {
        if (t.kindIcon) return false;
        if (t.kind === 'sub') return false;
        if (t.kind && t.kind !== 'main') return false;
        return true;
      });
      if (hint) hint.hidden = mains.length > 0;
      sel.disabled = mains.length === 0;
      mains.forEach((t) => {
        const o = document.createElement('option');
        o.value = t.ref;
        o.textContent = t.name + ' (' + shortRef(t.ref) + ')';
        sel.appendChild(o);
      });
      if (prev && mains.some((m) => m.ref === prev)) sel.value = prev;
      else sel.value = '';
    }

    function syncDummyParentVisibility(card) {
      const admin = isAdminKindUi();
      const msFld = dq(card, '[data-dfld="ms"]');
      const parentFld = dq(card, '[data-dfld="parent"]');
      if (!parentFld) return;
      if (admin && msFld && !msFld.hidden) {
        const show = getDummyMs(card) === 'sub';
        parentFld.hidden = !show;
        if (!show) dq(card, '[data-f="parent"]').value = '';
      } else {
        parentFld.hidden = false;
      }
      fillDummyParentOptions(card);
    }

    function syncDummyStagesVisibility(card) {
      const fld = dq(card, '[data-dfld="stages"]');
      if (!fld) return;
      const msFld = dq(card, '[data-dfld="ms"]');
      if (isAdminKindUi() && msFld && !msFld.hidden) {
        fld.hidden = !dummyStagesAllowed(card);
      } else {
        fld.hidden = false;
      }
    }

    function renderDummyStageChips(card, tokens, currentIndex) {
      const box = dq(card, '[data-f="stageChips"]');
      const hint = dq(card, '[data-f="stagePickHint"]');
      const bar = dq(card, '[data-f="stageBar"]');
      const fillEl = dq(card, '[data-f="stageBarFill"]');
      const idxEl = dq(card, '[data-f="stageIdx"]');
      box.innerHTML = '';
      const toks = tokens || [];
      const idx = Math.max(0, Math.min(Number(currentIndex) || 0, toks.length));
      hint.hidden = !toks.length;
      bar.hidden = !toks.length;
      fillEl.style.width = (toks.length ? Math.round((idx / toks.length) * 100) : 0) + '%';
      if (!toks.length) {
        box.innerHTML = '<span class="hint-sm">No stages yet — type #tokens above.</span>';
        return;
      }
      toks.forEach((tok, i) => {
        const pos = i + 1;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'stage-chip' + (pos <= idx ? ' on' : '');
        b.textContent = tok;
        b.onclick = () => {
          idxEl.value = String(pos);
          renderDummyStageChips(card, toks, pos);
        };
        box.appendChild(b);
      });
      const z = document.createElement('button');
      z.type = 'button'; z.className = 'stage-chip'; z.textContent = 'Clear';
      z.onclick = () => {
        idxEl.value = '0';
        renderDummyStageChips(card, toks, 0);
      };
      box.appendChild(z);
    }

    function syncDummyStagesUi(card, opts) {
      opts = opts || {};
      const stagesEl = dq(card, '[data-f="stages"]');
      const idxEl = dq(card, '[data-f="stageIdx"]');
      const errEl = dq(card, '[data-f="err"]');
      const parsed = parseStageTokensClient(stagesEl.value);
      if (!parsed.ok) {
        if (errEl && opts.showError !== false) errEl.textContent = parsed.error;
        // Keep chips from last good rewrite; do not silently strip bad input
        renderDummyStageChips(card, [], Number(idxEl.value) || 0);
        return [];
      }
      if (errEl && opts.clearError) errEl.textContent = '';
      if (opts.rewrite) stagesEl.value = parsed.tokens.join(' ');
      let idx = Number(idxEl.value) || 0;
      if (idx < 0) idx = 0;
      if (idx > parsed.tokens.length) idx = parsed.tokens.length;
      idxEl.value = String(idx);
      renderDummyStageChips(card, parsed.tokens, idx);
      return parsed.tokens;
    }

    function refreshDummyProjects(card) {
      const sel = dq(card, '[data-f="project"]');
      const prev = sel.value;
      sel.innerHTML = '';
      state.projects.forEach((p) => {
        const o = document.createElement('option'); o.value = p.code; o.textContent = p.name; sel.appendChild(o);
      });
      if (prev && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
      else if (state.projects[0]) sel.value = state.projects[0].code;
    }

    function updateDummySummary(card) {
      const name = dq(card, '[data-f="name"]').value.trim();
      dq(card, '.draft-summary').textContent = name || 'Untitled draft';
    }

    function setDummyCollapsed(card, collapsed) {
      card.classList.toggle('collapsed', collapsed);
      dq(card, '.draft-body').hidden = collapsed;
      const toggle = dq(card, '[data-act="toggle"]');
      if (toggle) toggle.textContent = collapsed ? 'Expand' : 'Collapse';
      updateDummySummary(card);
    }

    function buildDummyCard(id) {
      const admin = isAdminKindUi();
      const showPriority = perms().editScope === 'all';
      const card = document.createElement('article');
      card.className = 'task draft';
      card.dataset.draftId = id;
      card.innerHTML =
        '<div class="draft-head">'
        + '<span class="draft-plus" aria-hidden="true">+</span>'
        + '<strong>Draft</strong>'
        + '<span class="draft-summary">Untitled draft</span>'
        + '<button type="button" class="btn" data-act="toggle">Collapse</button>'
        + '<button type="button" class="btn" data-act="discard">Discard</button>'
        + '</div>'
        + '<div class="draft-body">'
        + '<div class="fld" data-dfld="project"><label>Project</label><select data-f="project"></select></div>'
        + '<div class="fld"><label>Name</label><input data-f="name" placeholder="Task name" /></div>'
        + '<div class="fld"><label>Description</label><textarea data-f="desc"></textarea></div>'
        + notesFieldHtml()
        + linksFieldHtml()
        + '<div class="fld"><label>Start time</label>'
        + '<input data-f="start" placeholder="DD-MMM | HH:MM" /></div>'
        + '<div class="fld"><label>End time</label>'
        + '<input data-f="end" placeholder="DD-MMM | HH:MM" /></div>'
        + '<div class="fld" data-dfld="status"><label>Status</label><select data-f="status"></select></div>'

    function fillDummyStatusOptions(card) {

    function addDummyDraft() {
      if (!canShowDrafts()) return;
      const id = 'd' + (++draftSeq) + '_' + Date.now().toString(36);

      $('draftList').prepend(card);
      setDummyCollapsed(card, false);

    async function submitDummyCard(card) {
      const errEl = dq(card, '[data-f="err"]');
      errEl.textContent = '';
      if (!perms().canCreate) {
        errEl.textContent = 'You cannot create tasks.';
        return;
      }
      const name = dq(card, '[data-f="name"]').value.trim();
      if (!name) {
        errEl.textContent = 'Name is required to submit.';
        setDummyCollapsed(card, false);
        return;
      }
      const draftScope = dq(card, '.draft-body') || card;
      const notesVal = getNotesValue(draftScope);
      const collectedLinks = collectLinksFromScope(draftScope);
      if (collectedLinks.some((l) => !String(l.name || '').trim())) {
        errEl.textContent = 'Every link needs a file name.';
        setDummyCollapsed(card, false);
        return;
      }
      const startEl = dq(card, '[data-f="start"]');
      const endEl = dq(card, '[data-f="end"]');
      let startDate = startEl ? startEl.value.trim() : '';
      let endDate = endEl ? endEl.value.trim() : '';
      if (!startDate) {
        startDate = istNowStamp();
        if (startEl) startEl.value = startDate;
      }
      if (!endDate) {
        endDate = defaultEndFromStart(startDate);
        if (endEl) endEl.value = endDate;
      }
      const body = {
        projectCode: dq(card, '[data-f="project"]').value,
        name,
        description: dq(card, '[data-f="desc"]').value,
        notes: notesVal,
        link: serializeTaskLinks(collectedLinks),
        startDate,
        endDate,
      };
      // Status is not chosen on draft — API create births status=Active (system path).
      const priFld = dq(card, '[data-dfld="priority"]');
      if (priFld && !priFld.hidden) body.priority = dq(card, '[data-f="priority"]').value;
      const msFld = dq(card, '[data-dfld="ms"]');
      if (isAdminKindUi() && msFld && !msFld.hidden) {
        const k = resolvedDummyKind(card);
        body.kind = k;
        if (k === 'sub') {
          if (!dq(card, '[data-f="parent"]').value) {
            errEl.textContent = 'Select a Main parent task.';
            setDummyCollapsed(card, false);
            return;
          }
          body.parentRef = dq(card, '[data-f="parent"]').value;
        }
      } else if (dq(card, '[data-f="parent"]').value) {
        // P2 (and non-admin): parent alone — never send kind
        body.parentRef = dq(card, '[data-f="parent"]').value;
      }
      try {
        if (dummyStagesAllowed(card)) {
          const stageCheck = parseStageTokensClient(dq(card, '[data-f="stages"]').value);
          if (!stageCheck.ok) {
            errEl.textContent = stageCheck.error;
            setDummyCollapsed(card, false);
            return;
          }
        }
        const created = await api('POST', '/api/tasks', body);
        const createdRef = created && created.task && created.task.ref;
        if (dummyStagesAllowed(card)) {
          const tokens = syncDummyStagesUi(card, { rewrite: true, clearError: true });
          if (tokens.length && createdRef) {
            await api('PATCH', '/api/tasks/' + createdRef + '/stages', {
              text: tokens.join(' '),
              currentIndex: Number(dq(card, '[data-f="stageIdx"]').value) || 0,
            });
          }
        }
        card.remove();
        if (body.link && createdRef) {
          try {
            await markNeedsReview(createdRef, body.link);
          } catch (revErr) {
            await refreshTasks();
            $('hint').textContent = 'Task saved, but Needs review failed: '
              + (revErr && revErr.message ? revErr.message : 'submit error')
              + ' — open EDIT and UPDATE to retry.';
            return;
          }
        }
        await refreshTasks();
      } catch (err) {
        errEl.textContent = err.message;
        setDummyCollapsed(card, false);
      }
    }

    function onDraftListClick(e) {
      const card = e.target.closest('.task.draft');
      if (!card || !$('draftList').contains(card)) return;
      const act = e.target.closest('[data-act]');
      if (act) {
        const a = act.dataset.act;
        const draftScope = dq(card, '.draft-body') || card;
        if (a === 'toggle') {
          setDummyCollapsed(card, !card.classList.contains('collapsed'));
          return;
        }
        if (a === 'discard') { card.remove(); return; }
        if (a === 'submit') { submitDummyCard(card); return; }
        if (a === 'addLink') {
          e.preventDefault();
          promptAddLink(draftScope);
          return;
        }
        if (a === 'addLinkCancel') {
          e.preventDefault();
          cancelAddLinkInline(draftScope);
          return;
        }
        if (a === 'addLinkSave') {
          e.preventDefault();
          saveAddLinkInline(draftScope);
          return;
        }
        if (a === 'rmLink') {
          e.preventDefault();
          const row = act.closest('.task-link-row');
          if (row) row.remove();
          syncAddLinkBtn(draftScope);
          return;

      }
      const msBtn = e.target.closest('.draft-ms .seg-btn');

        syncDummyParentVisibility(card);
        syncDummyStagesVisibility(card);
